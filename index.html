  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--pitch-deep);
    color: var(--chalk);
    font-family: 'Work Sans', sans-serif;
    min-height: 100%;
    background-image:

      repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 64px),

  .display { font-family: 'Teko', sans-serif; letter-spacing: 0.01em; }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-line); border-radius: 4px; }
  :is(button, input, select, a, [tabindex]):focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  /* ---- 7a0-inspired shared bits: pill buttons + jersey-number badges ---- */
  .btn-pill {
    border-radius: 999px !important;
    font-weight: 600;
    letter-spacing: 0.01em;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .btn-pill:not(:disabled):hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-pill:not(:disabled):active { transform: translateY(0); }
  .jersey-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 1.75rem;
    height: 1.75rem;
    border-radius: 999px;
    background: var(--gold);
    color: var(--pitch-deep);
    font-family: 'Teko', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1;
  }
  .card-soft {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 0.9rem;

  "Arsenal", "Aston Villa", "Bournemouth", "Brentford", "Brighton", "Chelsea",

function shuffleList(list) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

// Shuffled once per page load so join order isn't alphabetical every session.
const SESSION_CLUB_ORDER = shuffleList(PREMIER_LEAGUE_CLUBS_2026_27);

function pickNextClub(currentManagers) {
  const taken = new Set((currentManagers || []).map(m => m.club).filter(Boolean));
  return SESSION_CLUB_ORDER.find(c => !taken.has(c))
    || PREMIER_LEAGUE_CLUBS_2026_27.find(c => !taken.has(c))
    || "Arsenal";
}

function clubName(manager) {
  if (!manager) return "Unknown";
  return manager.club || `${manager.name} FC`;
}

function managerLabel(manager) {
  if (!manager) return "Unknown";
  if (manager.bot) return `${clubName(manager)} (CPU)`;
  return `${clubName(manager)} (${manager.name})`;
}

// Bots are named after their club, so managerLabel/(m.name) would read "Arsenal (Arsenal)" —
// this gives a cleaner "Arsenal (CPU)" for bots and falls back to the human's name otherwise.
function managerDisplayName(manager) {
  if (!manager) return "Unknown";
  return manager.bot ? `${manager.name} (CPU)` : manager.name;
}

const START_BUDGET = 100; // Cr
const SQUAD_SIZE = 11;
const BID_STEP = 1;
const INITIAL_DEFAULT_BASE = 10; // Cr — fallback used by fast simulation/backfill
const AUCTION_BOT_SETTLE_MS = 3200; // hidden inactivity window; no visible countdown
const AUCTION_BOT_TRANSITION_MS = 700; // short sold/unsold transition before next player

function crFmt(n) {
  return `₹${n.toLocaleString("en-IN")} Cr`;
}

const XI_TARGETS = {
  GK: 1, CB: 2, LB: 1, RB: 1, CDM: 1, CM: 1, CAM: 1, LW: 1, RW: 1, ST: 1,
};

function positionNeedFactor(squad, pos) {
  const list = squad || [];
  const have = list.filter(p => p.pos === pos).length;
  const target = XI_TARGETS[pos] || 1;
  const slots = SQUAD_SIZE - list.length;
  if (slots <= 0) return 0;
  if (have < target) return 1.4;
  let missingOther = 0;
  Object.keys(XI_TARGETS).forEach(p => {
    if (p === pos) return;
    const n = list.filter(x => x.pos === p).length;
    missingOther += Math.max(0, XI_TARGETS[p] - n);
  });
  if (missingOther >= slots) return 0;
  return 0.35;
}

function generateAuctionPrice(player, { managers = [], budgets = {}, squads = {}, poolLength = PLAYER_POOL.length } = {}) {
  // The Auctioneer Bot uses player quality + position value + current room demand,
  // with controlled randomness so similar players do not always open at the same price.
  const ratingValue = Math.max(0, (player.rating - 60) * 0.28);
  const positionValue = {
    GK: 0.6, CB: 1.1, LB: 0.9, RB: 0.9, CDM: 1.2, CM: 1.3,
    CAM: 1.7, LW: 1.8, RW: 1.8, ST: 2.2,
  }[player.pos] || 1;

  let demand = 0;
  managers.forEach(m => {
    const squad = squads[m.id] || [];
    const remainingBudget = Number(budgets[m.id] || 0);
    if (remainingBudget > 8 && squad.length < SQUAD_SIZE) {
      demand += positionNeedFactor(squad, player.pos);
    }
  });
  const demandValue = Math.min(3.5, demand / Math.max(1, managers.length));

  // Slightly lower the average opening price later in the auction as budgets tighten.
  const stageFactor = poolLength <= 30 ? 0.88 : poolLength <= 70 ? 0.95 : 1;
  const quality = 2.5 + ratingValue + positionValue + demandValue;
  const randomFactor = 0.78 + Math.random() * 0.44;
  const raw = quality * stageFactor * randomFactor;

  return Math.max(1, Math.min(24, Math.round(raw)));
}

function cpuMaxBid(player, base, budget, squad, remainingPool) {
  const slots = SQUAD_SIZE - (squad || []).length;
  if (slots <= 0 || budget < base) return 0;
  const need = positionNeedFactor(squad, player.pos);
  if (need <= 0) return 0;
  const ratings = (remainingPool || []).map(p => Number(p.rating) || 0);
  const poolAvg = ratings.length ? ratings.reduce((a, b) => a + b, 0) / ratings.length : 80;
  const rel = ((Number(player.rating) || 0) - poolAvg) / 12;
  const ratingFactor = 0.75 + Math.max(-0.2, Math.min(0.85, rel));
  const eliteBump = (Number(player.rating) || 0) >= 88 ? 1.35 : 1;
  let cap = Math.floor((budget / slots) * need * ratingFactor * eliteBump);
  cap = Math.floor(cap * (0.85 + Math.random() * 0.3));
  cap = Math.min(budget, Math.max(0, cap));
  return cap >= base ? cap : 0;
}

function cpuAuctionOne(player, base, managers, budgets, squads, remainingPool) {
  const caps = {};
  managers.forEach(m => {
    caps[m.id] = cpuMaxBid(player, base, budgets[m.id], squads[m.id], remainingPool);
  });
  let interested = managers.filter(m =>
    caps[m.id] >= base && budgets[m.id] >= base && (squads[m.id] || []).length < SQUAD_SIZE
  );
  if (interested.length === 0) return { sold: false };

  let price = base;
  let bidder = interested.length === 1 ? interested[0].id : null;
  if (interested.length === 1) return { sold: true, bidder, price };

  let guard = 0;
  while (interested.length > 1 && guard < 400) {
    guard += 1;
    const jump = Math.random() < 0.3 ? BID_STEP + Math.ceil(Math.random() * 2) : BID_STEP;
    const nextPrice = price + jump;
    const still = interested.filter(m =>
      caps[m.id] >= nextPrice && budgets[m.id] >= nextPrice && (squads[m.id] || []).length < SQUAD_SIZE
    );
    if (still.length === 0) break;
    still.sort((a, b) => (caps[b.id] - nextPrice) - (caps[a.id] - nextPrice));
    bidder = still[0].id;
    price = nextPrice;
    interested = still;
    if (still.length === 1) break;
  }
  if (!bidder) return { sold: false };
  return { sold: true, bidder, price };
}

function executeCpuAuction({ pool, managers, budgets, squads, defaultBasePrice, current }) {
  const nextBudgets = { ...budgets };
  const nextSquads = {};
  managers.forEach(m => {
    nextSquads[m.id] = [...(squads[m.id] || [])];
  });
  let nextPool = [...pool];
  const logs = [];

  function labelOf(id) {
    return managerLabel(managers.find(m => m.id === id));
  }

  if (current && current.status === "live") {
    const player = current.player;
    if (current.bidder) {
      const mid = current.bidder;
      nextBudgets[mid] = nextBudgets[mid] - current.bid;
      nextSquads[mid].push({ ...player, price: current.bid });
      nextPool = nextPool.filter(p => p.id !== player.id);
      logs.push(`SOLD — ${player.name} to ${labelOf(mid)} for ${crFmt(current.bid)}.`);
    } else {
      logs.push(`${player.name} went UNSOLD — no bids.`);
    }
  }

  const toSell = [...nextPool];
  toSell.forEach(player => {
    if (!nextPool.some(p => p.id === player.id)) return;
    const override = current && current.player && current.player.id === player.id && Number(current.base) > 0
      ? Number(current.base)
      : defaultBasePrice;
    const result = cpuAuctionOne(player, override, managers, nextBudgets, nextSquads, nextPool);
    if (result.sold) {
      nextBudgets[result.bidder] -= result.price;
      nextSquads[result.bidder].push({ ...player, price: result.price });
      nextPool = nextPool.filter(p => p.id !== player.id);
      logs.push(`SOLD — ${player.name} to ${labelOf(result.bidder)} for ${crFmt(result.price)}.`);
    } else {
      logs.push(`${player.name} went UNSOLD — no bids.`);
    }
  });

  return { nextPool, nextBudgets, nextSquads, logs };
}

// After the competitive CPU bidding above, budget constraints can leave some managers short
// of a full XI (they simply couldn't afford or win enough players). This pass tops every
// manager up to exactly SQUAD_SIZE using whatever's left in the pool, favouring positions
// they're still missing, and charging whatever they can still afford (as low as ₹0 if a
// manager is broke) so "Simulate entire auction" always finishes with complete squads.
function neededPositionsFor(squad) {
  const need = new Set();
  Object.keys(XI_TARGETS).forEach(pos => {
    const have = (squad || []).filter(p => p.pos === pos).length;
    if (have < XI_TARGETS[pos]) need.add(pos);
  });
  return need;
}

function backfillSquads({ managers, budgets, squads, pool, defaultBasePrice }) {
  const remainingPool = [...pool];
  const nextBudgets = { ...budgets };
  const nextSquads = {};
  managers.forEach(m => {
    nextSquads[m.id] = [...(squads[m.id] || [])];
  });
  const addedCount = {};
  const addedCost = {};

  let needer = shuffleList(managers.filter(m => nextSquads[m.id].length < SQUAD_SIZE));
  let guard = 0;
  while (needer.length > 0 && remainingPool.length > 0 && guard < 5000) {
    guard += 1;
    for (const m of needer) {
      if (nextSquads[m.id].length >= SQUAD_SIZE || remainingPool.length === 0) continue;
      const need = neededPositionsFor(nextSquads[m.id]);
      let idx = remainingPool.findIndex(p => need.has(p.pos));
      if (idx === -1) idx = 0;
      const player = remainingPool[idx];
      const price = Math.max(0, Math.min(defaultBasePrice, nextBudgets[m.id]));
      nextBudgets[m.id] -= price;
      nextSquads[m.id].push({ ...player, price });
      remainingPool.splice(idx, 1);
      addedCount[m.id] = (addedCount[m.id] || 0) + 1;
      addedCost[m.id] = (addedCost[m.id] || 0) + price;
    }
    needer = needer.filter(m => nextSquads[m.id].length < SQUAD_SIZE);
  }

  const logs = managers
    .filter(m => addedCount[m.id])
    .map(m => `Auto-filled ${addedCount[m.id]} more player${addedCount[m.id] === 1 ? "" : "s"} for ${managerLabel(m)} to complete their XI (${crFmt(addedCost[m.id])} total).`);

  const shortfall = managers.filter(m => nextSquads[m.id].length < SQUAD_SIZE);
  if (shortfall.length > 0) {
    logs.push(`Not enough players left in the pool to fully complete ${shortfall.length} squad${shortfall.length === 1 ? "" : "s"} (${shortfall.map(m => managerLabel(m)).join(", ")}).`);
  }

  return { nextPool: remainingPool, nextBudgets, nextSquads, logs };
}

function makeManagerId() {
  return `m_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
}

// When simulating an auction with too few managers to be a real contest (e.g. a solo player),
// we top the room up to this many seats with CPU bots before running the simulation. Bots bid
// generally and competitively for any player (via cpuMaxBid/cpuAuctionOne below) — they are not
// restricted to players who actually play for their assigned club.
const SIMULATE_TARGET_MANAGERS = 8;

function addBotManagers(existingManagers, targetCount) {
  const bots = [];
  let running = [...existingManagers];
  const cap = Math.min(targetCount, MAX_MANAGERS);
  while (running.length < cap) {
    const club = pickNextClub(running);
    const bot = {
      id: makeManagerId(),
      name: club,
      color: MANAGER_COLORS[running.length % MANAGER_COLORS.length],
      club,
      bot: true,
    };
    bots.push(bot);
    running = [...running, bot];
  }
  return bots;
}

// The Premier League season always features all 20 real clubs, regardless of how many
// people actually took part in the auction. A club a manager drafted uses that manager's
// actual won squad; any club nobody claimed gets a CPU-only team built from real players in
// the pool who genuinely play for that club (padded with generic reserves if the pool doesn't
// have a full XI's worth for them). These CPU-only teams are kept separate from the auction's
// managers/budgets/squads state — they never touch anyone's budget or the draft pool.
function buildLeagueTeams(managers, squads) {
  const claimedByClub = {};
  managers.forEach(m => {
    if (m.club) claimedByClub[m.club] = m;
  });

  return PREMIER_LEAGUE_CLUBS_2026_27.map(club => {
    const manager = claimedByClub[club];
    if (manager) {
      return {
        id: club,
        club,
        managerId: manager.id,
        managerName: manager.name,
        isCpu: !!manager.bot,
        color: manager.color,
        squad: squads[manager.id] || [],
      };
    }

    const realPlayers = PLAYER_POOL
      .filter(p => p.club === club)
      .sort((a, b) => b.rating - a.rating);
    const squad = realPlayers.slice(0, SQUAD_SIZE).map(p => ({ ...p }));
    if (squad.length < SQUAD_SIZE) {
      const avg = squad.length ? averageRating(squad) : 76;
      const missing = SQUAD_SIZE - squad.length;
      for (let i = 0; i < missing; i++) {
        squad.push({
          id: `filler_${club}_${i}`,
          name: `${club} Reserve`,
          pos: Object.keys(XI_TARGETS)[i % Object.keys(XI_TARGETS).length],
          club,
          nation: "—",
          rating: Math.max(58, Math.round(avg - 4 - i)),
        });
      }
    }

    return {
      id: club,
      club,
      managerId: null,
      managerName: null,
      isCpu: true,
      color: null,
      squad,
    };
  });
}

const BYE_ID = "BYE";

function generateFixtures(managerIds) {
  const ids = [...managerIds];
  if (ids.length < 2) return [];
  if (ids.length % 2 === 1) ids.push(BYE_ID);

  const n = ids.length;
  const rounds = n - 1;
  let circle = [...ids];
  const firstLeg = [];

  for (let r = 0; r < rounds; r++) {
    const matchday = [];
    for (let i = 0; i < n / 2; i++) {
      const home = circle[i];
      const away = circle[n - 1 - i];
      if (home === BYE_ID || away === BYE_ID) continue;
      matchday.push({ home, away, played: false, homeGoals: null, awayGoals: null });
    }
    firstLeg.push(matchday);
    // Circle method: keep index 0 fixed, rotate the rest.
    circle = [circle[0], circle[n - 1], ...circle.slice(1, n - 1)];
  }

  const secondLeg = firstLeg.map(matchday =>
    matchday.map(f => ({
      home: f.away,
      away: f.home,
      played: false,
      homeGoals: null,
      awayGoals: null,
    }))
  );

  return [...firstLeg, ...secondLeg];
}

function averageRating(squad) {
  if (!squad || squad.length === 0) return 65;
  const sum = squad.reduce((acc, p) => acc + (Number(p.rating) || 0), 0);
  return sum / squad.length;
}

function poissonKnuth(lambda) {
  const L = Math.exp(-Math.max(0, lambda));
  let k = 0;
  let p = 1;
  do {
    k += 1;
    p *= Math.random();
  } while (p > L);
  return k - 1;
}

function simulateScore(ratingA, ratingB) {
  const BASE_XG = 1.4;
  const perPoint = 0.05;
  const diff = (Number(ratingA) || 0) - (Number(ratingB) || 0);
  const clamp = n => Math.min(4, Math.max(0.2, n));
  const homeXg = clamp(BASE_XG + diff * perPoint);
  const awayXg = clamp(BASE_XG - diff * perPoint);
  return { homeGoals: poissonKnuth(homeXg), awayGoals: poissonKnuth(awayXg) };
}

function isRealFixture(f) {
  return f && f.home !== BYE_ID && f.away !== BYE_ID;
}

// How likely each position is to be the scorer of a given goal — attackers far more likely
// than defenders, defenders more likely than a goalkeeper (own-goal-style rarity for GKs).
const GOAL_WEIGHT_BY_POS = { ST: 5, LW: 4, RW: 4, CAM: 4, CM: 2.2, CDM: 1.2, LB: 0.7, RB: 0.7, CB: 0.5, GK: 0.05 };

// Player-of-the-Season scoring, loosely modeled on classic fantasy football points: goals from
// deeper positions are worth more (rarer), clean sheets only count for the back line + keeper.
const GOAL_POINTS_BY_POS = { GK: 10, CB: 6, LB: 6, RB: 6, CDM: 5, CM: 5, CAM: 4, LW: 4, RW: 4, ST: 4 };
const CLEANSHEET_POINTS_BY_POS = { GK: 6, CB: 4, LB: 4, RB: 4, CDM: 1 };
const CLEANSHEET_POSITIONS = ["GK", "CB", "LB", "RB"];

function pickScorer(squad) {
  const pool = (squad || []).filter(p => p && p.pos);
  if (pool.length === 0) return null;
  const weighted = pool.map(p => ({
    player: p,
    weight: (GOAL_WEIGHT_BY_POS[p.pos] ?? 1) * Math.max(1, (Number(p.rating) || 60) - 50),
  }));
  const total = weighted.reduce((sum, w) => sum + w.weight, 0);
  if (total <= 0) return pool[0];
  let roll = Math.random() * total;
  for (const w of weighted) {
    roll -= w.weight;
    if (roll <= 0) return w.player;
  }
  return weighted[weighted.length - 1].player;
}

// Combines a season's worth of played fixtures into per-player goal/clean-sheet/points totals,
// then derives the three end-of-season awards from them.
function computeSeasonAwards(teams, fixtures) {
  const stats = {};
  const byTeamId = Object.fromEntries(teams.map(t => [t.id, t]));

  function statRow(player, teamId) {
    if (!stats[player.id]) {
      const team = byTeamId[teamId];
      stats[player.id] = {
        id: player.id,
        name: player.name,
        pos: player.pos,
        teamId,
        teamName: team ? team.club : teamId,
        goals: 0,
        cleanSheets: 0,
        points: 0,
      };
    }
    return stats[player.id];
  }

  (fixtures || []).forEach(matchday => {
    (matchday || []).forEach(f => {
      if (!isRealFixture(f) || !f.played) return;
      (f.homeScorers || []).forEach(s => { statRow(s, f.home).goals += 1; });
      (f.awayScorers || []).forEach(s => { statRow(s, f.away).goals += 1; });

      if (f.awayGoals === 0) {
        const homeTeam = byTeamId[f.home];
        (homeTeam?.squad || []).forEach(p => {
          if (CLEANSHEET_POSITIONS.includes(p.pos)) statRow(p, f.home).cleanSheets += 1;
        });
      }
      if (f.homeGoals === 0) {
        const awayTeam = byTeamId[f.away];
        (awayTeam?.squad || []).forEach(p => {
          if (CLEANSHEET_POSITIONS.includes(p.pos)) statRow(p, f.away).cleanSheets += 1;
        });
      }
    });
  });

  const all = Object.values(stats).map(row => {
    const goalPts = GOAL_POINTS_BY_POS[row.pos] ?? 4;
    const csPts = CLEANSHEET_POINTS_BY_POS[row.pos] ?? 0;
    return { ...row, points: row.goals * goalPts + row.cleanSheets * csPts };
  });

  const topScorers = all.filter(r => r.goals > 0).sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name));
  const topGloves = all.filter(r => r.pos === "GK" && r.cleanSheets > 0).sort((a, b) => b.cleanSheets - a.cleanSheets || a.name.localeCompare(b.name));
  const topPerformers = all.slice().sort((a, b) => b.points - a.points || a.name.localeCompare(b.name));

  return {
    topScorers,
    topGloves,
    topPerformers,
    goldenBoot: topScorers[0] || null,
    goldenGlove: topGloves[0] || null,
    playerOfSeason: topPerformers[0] || null,
  };
}

function summarizeScorers(scorers) {
  const counts = {};
  const order = [];
  (scorers || []).forEach(s => {
    if (!counts[s.name]) { counts[s.name] = 0; order.push(s.name); }
    counts[s.name] += 1;
  });
  return order.map(name => (counts[name] > 1 ? `${name} x${counts[name]}` : name)).join(", ");
}

// Same idea as summarizeScorers, but reads minute-stamped events from a match timeline for one
// side and groups them per player, e.g. "Haaland 23', 67' · Foden 81'".
function summarizeTimelineSide(timeline, side) {
  const byName = {};
  const order = [];
  (timeline || []).filter(e => e.side === side).forEach(e => {
    if (!byName[e.scorer.name]) { byName[e.scorer.name] = []; order.push(e.scorer.name); }
    byName[e.scorer.name].push(e.minute);
  });
  return order.map(name => `${name} ${byName[name].map(formatMinute).join(", ")}`).join(" · ");
}

function formatMinute(m) {
  return m > 90 ? `90+${m - 90}'` : `${m}'`;
}

// A goal is a bit more likely in the run-up to half-time and full-time (realistic-ish shape)
// than perfectly uniform across 90 minutes, plus a small chance of a stoppage-time goal.
function randomGoalMinute() {
  if (Math.random() < 0.06) return 90 + Math.ceil(Math.random() * 5); // stoppage time
  return Math.max(1, Math.ceil(Math.random() * 90));
}

// Interleaves each side's goalscorers into one chronological, minute-stamped timeline.
function buildMatchTimeline(homeScorers, awayScorers) {
  const events = [];
  (homeScorers || []).forEach(s => events.push({ side: "home", scorer: s, minute: randomGoalMinute() }));
  (awayScorers || []).forEach(s => events.push({ side: "away", scorer: s, minute: randomGoalMinute() }));
  events.sort((a, b) => a.minute - b.minute);
  return events;
}

// Flavor-only penalty shootout for a human-vs-human draw — decides bragging rights, not points
// (league standings still record it as a draw, same as a real Premier League tie).
function simulatePenaltyShootout(homeSquad, awaySquad) {
  function takers(squad) {
    const outfield = (squad || []).filter(p => p.pos !== "GK");
    const pool = outfield.length > 0 ? outfield : (squad || []);
    const sorted = [...pool].sort((a, b) => (Number(b.rating) || 60) - (Number(a.rating) || 60));
    const list = [];
    for (let i = 0; i < 5; i++) list.push(sorted[i % Math.max(1, sorted.length)] || { name: "Player", rating: 65 });
    return list;
  }
  function scoreProb(rating) {
    return Math.min(0.92, Math.max(0.55, (Number(rating) || 65) / 100 + 0.15));
  }
  const homeTakers = takers(homeSquad);
  const awayTakers = takers(awaySquad);
  let homeScore = 0, awayScore = 0;
  const rounds = [];
  for (let i = 0; i < 5; i++) {
    const h = homeTakers[i];
    const hScored = Math.random() < scoreProb(h.rating);
    if (hScored) homeScore++;
    rounds.push({ side: "home", name: h.name, scored: hScored });

    const a = awayTakers[i];
    const aScored = Math.random() < scoreProb(a.rating);
    if (aScored) awayScore++;
    rounds.push({ side: "away", name: a.name, scored: aScored });
  }
  let sdCount = 0;
  while (homeScore === awayScore && sdCount < 10) {
    const h = homeTakers[sdCount % homeTakers.length];
    const a = awayTakers[sdCount % awayTakers.length];
    const hScored = Math.random() < scoreProb(h.rating);
    const aScored = Math.random() < scoreProb(a.rating);
    if (hScored) homeScore++;
    if (aScored) awayScore++;
    rounds.push({ side: "home", name: h.name, scored: hScored, suddenDeath: true });
    rounds.push({ side: "away", name: a.name, scored: aScored, suddenDeath: true });
    sdCount++;
  }
  if (homeScore === awayScore) {
    // Vanishingly unlikely after 10 sudden-death rounds — force a decision rather than looping forever.
    if (Math.random() < 0.5) homeScore++; else awayScore++;
  }
  return { homeScore, awayScore, winnerSide: homeScore > awayScore ? "home" : "away", rounds };
}

function computeStandings(teams, fixtures) {
  const rows = {};
  teams.forEach(t => {
    rows[t.id] = {
      id: t.id,
      name: t.club,
      Played: 0,
      Won: 0,
      Drawn: 0,
      Lost: 0,
      GoalsFor: 0,
      GoalsAgainst: 0,
      GoalDifference: 0,
      Points: 0,
    };
  });

  (fixtures || []).forEach(matchday => {
    (matchday || []).forEach(f => {
      if (!f.played || !isRealFixture(f)) return;
      const home = rows[f.home];
      const away = rows[f.away];
      if (!home || !away) return;
      home.Played += 1;
      away.Played += 1;
      home.GoalsFor += f.homeGoals;
      home.GoalsAgainst += f.awayGoals;
      away.GoalsFor += f.awayGoals;
      away.GoalsAgainst += f.homeGoals;
      if (f.homeGoals > f.awayGoals) {
        home.Won += 1;
        away.Lost += 1;
        home.Points += 3;
      } else if (f.homeGoals < f.awayGoals) {
        away.Won += 1;
        home.Lost += 1;
        away.Points += 3;
      } else {
        home.Drawn += 1;
        away.Drawn += 1;
        home.Points += 1;
        away.Points += 1;
      }
    });
  });

  return Object.values(rows)
    .map(row => ({ ...row, GoalDifference: row.GoalsFor - row.GoalsAgainst }))
    .sort((a, b) => {
      if (b.Points !== a.Points) return b.Points - a.Points;
      if (b.GoalDifference !== a.GoalDifference) return b.GoalDifference - a.GoalDifference;
      if (b.GoalsFor !== a.GoalsFor) return b.GoalsFor - a.GoalsFor;
      return a.name.localeCompare(b.name);
    });
}

function fixtureKey(matchdayIndex, f) {
  return `${matchdayIndex}:${f.home}:${f.away}`;
}

// teamsById: map of team id -> { squad, managerId, isCpu, ... } (see buildLeagueTeams). Needed
// (rather than just squads) so we can tell a genuine human-vs-human fixture apart from any
// match involving a CPU side — that distinction drives the slow live-ticker animation and the
// penalty-shootout flavor in the UI layer.
function playMatchday(matchdays, index, teamsById) {
  return matchdays.map((matchday, i) => {
    if (i !== index) return matchday;
    return matchday.map(f => {
      if (f.played || !isRealFixture(f)) return f;
      const homeTeam = teamsById[f.home] || {};
      const awayTeam = teamsById[f.away] || {};
      const homeSquad = homeTeam.squad || [];
      const awaySquad = awayTeam.squad || [];
      const { homeGoals, awayGoals } = simulateScore(
        averageRating(homeSquad),
        averageRating(awaySquad)
      );
      const homeScorers = [];
      for (let g = 0; g < homeGoals; g++) {
        const scorer = pickScorer(homeSquad);
        if (scorer) homeScorers.push({ id: scorer.id, name: scorer.name, pos: scorer.pos });
      }
      const awayScorers = [];
      for (let g = 0; g < awayGoals; g++) {
        const scorer = pickScorer(awaySquad);
        if (scorer) awayScorers.push({ id: scorer.id, name: scorer.name, pos: scorer.pos });
      }
      const timeline = buildMatchTimeline(homeScorers, awayScorers);
      const isPvP = !!homeTeam.managerId && !homeTeam.isCpu && !!awayTeam.managerId && !awayTeam.isCpu;
      const penalties = (isPvP && homeGoals === awayGoals)
        ? simulatePenaltyShootout(homeSquad, awaySquad)
        : null;
      return { ...f, played: true, homeGoals, awayGoals, homeScorers, awayScorers, timeline, isPvP, penalties };
    });
  });
}

// ---------- Root ----------
function App() {
  const [viewAs, setViewAs] = useState(null); // manager id only — Auctioneer is always the bot
  const [pool, setPool] = useState(PLAYER_POOL);
  const [defaultBasePrice, setDefaultBasePriceState] = useState(INITIAL_DEFAULT_BASE);
  const [current, setCurrent] = useState(null); // { player, base, bid, bidder, status: 'idle'|'live'|'sold'|'unsold' }
  const [managers, setManagers] = useState([]); // { id, name, color }
  const [budgets, setBudgets] = useState({});
  const [squads, setSquads] = useState({});
  const [bidHistory, setBidHistory] = useState([]);
  const [log, setLog] = useState(["Room created. XOLO Auctioneer Bot is waiting for managers."]);
  const auctionBotTimeoutRef = useRef(null);
  const auctionTransitionTimeoutRef = useRef(null);
  const [phase, setPhase] = useState("auction");
  const [fixtures, setFixtures] = useState([]);
  const [lastSimulatedKeys, setLastSimulatedKeys] = useState([]);
  const [leagueTeams, setLeagueTeams] = useState([]); // all 20 PL clubs — drafted ones use the manager's squad, the rest are CPU-only
  const [liveMatch, setLiveMatch] = useState(null); // in-progress animated ticker for a human-vs-human match
  const [botPaused, setBotPaused] = useState(false);

  function addLog(msg) {
    setLog(l => [msg, ...l].slice(0, 30));
  }

  function addManager(rawName) {
    const name = (rawName || "").trim().slice(0, MAX_NAME_LENGTH);
    if (!name) {
      addLog("Enter a name to join as a manager.");
      return null;
    }
    if (managers.length >= MAX_MANAGERS) {
      addLog(`The manager list is full (max ${MAX_MANAGERS}).`);
      return null;
    }
    if (managers.some(m => m.name.toLowerCase() === name.toLowerCase())) {
      addLog(`"${name}" is already in the auction — try a different name.`);
      return null;
    }
    const id = makeManagerId();
    const color = MANAGER_COLORS[managers.length % MANAGER_COLORS.length];
    const club = pickNextClub(managers);
    setManagers(list => [...list, { id, name, color, club }]);
    setBudgets(b => ({ ...b, [id]: START_BUDGET }));
    setSquads(s => ({ ...s, [id]: [] }));
    addLog(`${name} joined the auction.`);
    return id;
  }

  function removeManager(id) {
    const m = managers.find(mm => mm.id === id);
    if (!m) return;
    if (squads[id] && squads[id].length > 0) {
      addLog(`Can't remove ${m.name} — they already own players.`);
      return;
    }
    if (current && current.bidder === id) {
      addLog(`Can't remove ${m.name} — they're the current highest bidder.`);
      return;
    }
    setManagers(list => list.filter(mm => mm.id !== id));
    setBudgets(b => {
      const rest = { ...b };
      delete rest[id];
      return rest;
    });
    setSquads(s => {
      const rest = { ...s };
      delete rest[id];
      return rest;
    });
    if (viewAs === id) setViewAs(managers.find(mm => mm.id !== id)?.id ?? null);
    addLog(`${m.name} left the auction.`);
  }

  function scheduleAuctionBot(ms, callback) {
    if (auctionBotTimeoutRef.current) clearTimeout(auctionBotTimeoutRef.current);
    auctionBotTimeoutRef.current = setTimeout(() => {
      auctionBotTimeoutRef.current = null;
      callback();
    }, ms);
  }

  function startNextBotAuction() {
    if (phase !== "auction" || managers.length === 0 || pool.length === 0 || current) return;

    const player = pool[0];
    const openingPrice = generateAuctionPrice(player, { managers, budgets, squads, poolLength: pool.length });
    setCurrent({ player, base: openingPrice, bid: openingPrice, bidder: null, status: "live" });
    setBidHistory([]);
    addLog(`XOLO Auctioneer Bot opens ${player.name} at ${crFmt(openingPrice)}.`);
  }

  useEffect(() => {
    if (phase !== "auction" || botPaused || managers.length === 0 || current || pool.length === 0) return;
    startNextBotAuction();
  }, [phase, botPaused, managers.length, current, pool.length]);

  useEffect(() => {
    if (phase !== "auction" || botPaused || !current || current.status !== "live") return;
    scheduleAuctionBot(AUCTION_BOT_SETTLE_MS, () => finishAuction());
    return () => {
      if (auctionBotTimeoutRef.current) {
        clearTimeout(auctionBotTimeoutRef.current);
        auctionBotTimeoutRef.current = null;
      }
    };
  }, [phase, botPaused, current?.player?.id, current?.bid, current?.status]);

  useEffect(() => {
    return () => {
      if (auctionBotTimeoutRef.current) clearTimeout(auctionBotTimeoutRef.current);
      if (auctionTransitionTimeoutRef.current) clearTimeout(auctionTransitionTimeoutRef.current);
    };
  }, []);

  function placeBid(managerId, amount) {
    if (!current || current.status !== "live") return;
    // Managers can either submit an explicit amount or use the standard +1 bid step.
    const bidAmount = amount !== undefined && amount !== null && amount !== ""
      ? Number(amount)
      : current.bid + BID_STEP;

    if (!Number.isFinite(bidAmount) || bidAmount <= current.bid) {
      addLog(`Bid rejected — ${Number.isFinite(bidAmount) ? crFmt(bidAmount) : "that amount"} is not higher than the current bid of ${crFmt(current.bid)}.`);
      return;
    }
    if (budgets[managerId] < bidAmount) {
      addLog(`${label(managerId)} tried to bid but doesn't have enough budget.`);
      return;
    }
    if (squads[managerId].length >= SQUAD_SIZE) {
      addLog(`${label(managerId)} squad is already full.`);
      return;
    }
    setCurrent(c => ({ ...c, bid: bidAmount, bidder: managerId }));
    setBidHistory(h => [{ managerId, amount: bidAmount }, ...h]);
    addLog(`${label(managerId)} bids ${crFmt(bidAmount)}.`);

  }

  function label(id) {
    return managerDisplayName(managers.find(m => m.id === id)) ?? id;
  }

  function finishAuction() {
    if (!current || current.status !== "live") return;
    if (auctionBotTimeoutRef.current) {
      clearTimeout(auctionBotTimeoutRef.current);
      auctionBotTimeoutRef.current = null;
    }

    if (current.bidder) {
      const mid = current.bidder;
      const soldPlayer = { ...current.player, price: current.bid };
      setBudgets(b => ({ ...b, [mid]: b[mid] - current.bid }));
      setSquads(s => ({ ...s, [mid]: [...s[mid], soldPlayer] }));
      setCurrent(c => ({ ...c, status: "sold" }));
      setPool(p => p.filter(pl => pl.id !== current.player.id));
      addLog(`SOLD — ${current.player.name} to ${label(mid)} for ${crFmt(current.bid)}.`);
    } else {
      setCurrent(c => ({ ...c, status: "unsold" }));
      addLog(`${current.player.name} went UNSOLD — no bids.`);
    }

    // Short transition only; there is no visible auction countdown/timer.
    if (auctionTransitionTimeoutRef.current) clearTimeout(auctionTransitionTimeoutRef.current);
    auctionTransitionTimeoutRef.current = setTimeout(() => {
      auctionTransitionTimeoutRef.current = null;
      setCurrent(null);
    }, AUCTION_BOT_TRANSITION_MS);
  }

  function skipPlayer() {
    if (!current || current.status !== "live") return;
    if (auctionBotTimeoutRef.current) {
      clearTimeout(auctionBotTimeoutRef.current);
      auctionBotTimeoutRef.current = null;
    }
    if (auctionTransitionTimeoutRef.current) {
      clearTimeout(auctionTransitionTimeoutRef.current);
      auctionTransitionTimeoutRef.current = null;
    }
    addLog(`${current.player.name} skipped by Auctioneer Bot.`);
    setCurrent(null);
  }

  function simulateEntireAuction() {
    if (managers.length === 0) {
      addLog("Add yourself as a manager before simulating the auction.");
      return;
    }

    setBotPaused(true);

    // Snapshot the state we'll simulate against. If it's currently a solo (or near-solo) room,
    // top it up with CPU bot managers first so there's real competition for every player.
    let simManagers = managers;
    let simBudgets = budgets;
    let simSquads = squads;

    if (managers.length < SIMULATE_TARGET_MANAGERS) {
      const bots = addBotManagers(managers, SIMULATE_TARGET_MANAGERS);
      if (bots.length > 0) {
        simManagers = [...managers, ...bots];
        simBudgets = { ...budgets };
        simSquads = { ...squads };
        bots.forEach(b => {
          simBudgets[b.id] = START_BUDGET;
          simSquads[b.id] = [];
        });
        setManagers(simManagers);
        setBudgets(simBudgets);
        setSquads(simSquads);
        addLog(`Added ${bots.length} CPU bot manager${bots.length === 1 ? "" : "s"} for real competition, then simulated the rest of the auction.`);
      }
    }

    const result = executeCpuAuction({
      pool,
      managers: simManagers,
      budgets: simBudgets,
      squads: simSquads,
      defaultBasePrice,
      current,
    });

    // Competitive bidding alone can leave some managers short of a full XI if their budget
    // runs dry — top everyone up to SQUAD_SIZE from what's left in the pool.
    const filled = backfillSquads({
      managers: simManagers,
      budgets: result.nextBudgets,
      squads: result.nextSquads,
      pool: result.nextPool,
      defaultBasePrice,
    });

    setPool(filled.nextPool);
    setBudgets(filled.nextBudgets);
    setSquads(filled.nextSquads);
    setCurrent(null);
    setBidHistory([]);
    setLog(l => [...[...filled.logs].reverse(), ...[...result.logs].reverse(), ...l].slice(0, 30));
    // Keep the automatic bot paused after a full fast-forward; the auction has already been resolved.
    setBotPaused(true);
  }

  function startLeague() {
    // The season always runs as a full 20-club Premier League. Any club a manager actually
    // drafted uses their real squad; every other club is filled by a CPU-only team.
    const teams = buildLeagueTeams(managers, squads);
    setLeagueTeams(teams);
    setFixtures(generateFixtures(teams.map(t => t.id)));
    setLastSimulatedKeys([]);
    setPhase("league");
    const cpuCount = teams.filter(t => !t.managerId).length;
    addLog(cpuCount > 0
      ? `Premier League started — all 20 clubs are in, with ${cpuCount} CPU team${cpuCount === 1 ? "" : "s"} filling the clubs nobody drafted.`
      : "Premier League started — all 20 clubs are in.");
  }

  // Slowly reveals a human-vs-human match's pre-computed timeline event by event (like a live
  // ticker) before resolving. Everything else (CPU involved anywhere) stays instant — this is
  // purely a presentation delay, the actual result (f) is already fully decided going in.
  function animateMatch(f, teamsById) {
    return new Promise(resolve => {
      const homeTeam = teamsById[f.home];
      const awayTeam = teamsById[f.away];
      setLiveMatch({
        home: f.home,
        away: f.away,
        homeName: clubName(homeTeam),
        awayName: clubName(awayTeam),
        homeColor: homeTeam?.color || "var(--chalk)",
        awayColor: awayTeam?.color || "var(--chalk)",
        events: [],
        minute: 0,
        finished: false,
        penalties: null,
      });
      const timeline = f.timeline || [];
      const tickDelayMs = 500;
      let i = 0;
      const tick = () => {
        if (i < timeline.length) {
          const ev = timeline[i];
          i += 1;
          setLiveMatch(lm => (lm ? { ...lm, events: [...lm.events, ev], minute: ev.minute } : lm));
          setTimeout(tick, tickDelayMs);
        } else {
          setLiveMatch(lm => (lm ? { ...lm, minute: 90, finished: true, penalties: f.penalties } : lm));
          setTimeout(resolve, f.penalties ? 1800 : 1100);
        }
      };
      setTimeout(tick, tickDelayMs);
    });
  }

  async function simulateMatchday(index) {
    const teamsById = Object.fromEntries(leagueTeams.map(t => [t.id, t]));
    const unplayed = (fixtures[index] || []).filter(f => isRealFixture(f) && !f.played);
    setLastSimulatedKeys(unplayed.map(f => fixtureKey(index, f)));

    const resolvedMatchday = playMatchday(fixtures, index, teamsById)[index];
    const pvpFixtures = resolvedMatchday.filter(f =>
      isRealFixture(f) && f.isPvP && unplayed.some(u => u.home === f.home && u.away === f.away)
    );

    for (const f of pvpFixtures) {
      await animateMatch(f, teamsById);
    }
    setLiveMatch(null);
    setFixtures(prev => prev.map((md, i) => (i === index ? resolvedMatchday : md)));
    addLog(`Matchday ${index + 1} simulated.`);
  }

  async function simulateFullSeason() {
    const teamsById = Object.fromEntries(leagueTeams.map(t => [t.id, t]));
    const keys = [];
    fixtures.forEach((matchday, i) => {
      matchday.forEach(f => {
        if (isRealFixture(f) && !f.played) keys.push(fixtureKey(i, f));
      });
    });
    setLastSimulatedKeys(keys);

    let working = fixtures;
    for (let i = 0; i < working.length; i++) {
      const unplayed = (working[i] || []).filter(f => isRealFixture(f) && !f.played);
      if (unplayed.length === 0) continue;
      const resolvedMatchday = playMatchday(working, i, teamsById)[i];
      const pvpFixtures = resolvedMatchday.filter(f =>
        isRealFixture(f) && f.isPvP && unplayed.some(u => u.home === f.home && u.away === f.away)
      );
      for (const f of pvpFixtures) {
        await animateMatch(f, teamsById);
      }
      working = working.map((md, idx) => (idx === i ? resolvedMatchday : md));
      setFixtures(working);
    }
    setLiveMatch(null);
    addLog("Rest of the season simulated.");
  }

  return (
    <div className="min-h-screen flex flex-col">
      <TopBar viewAs={viewAs} setViewAs={setViewAs} poolCount={pool.length} managers={managers} addManager={addManager} phase={phase} />
      {phase === "league" ? (
        <LeagueView
          teams={leagueTeams}
          fixtures={fixtures}
          simulateMatchday={simulateMatchday}
          simulateFullSeason={simulateFullSeason}
          viewAs={viewAs}
          lastSimulatedKeys={lastSimulatedKeys}
          liveMatch={liveMatch}
        />
      ) : (
      <div className="flex-1 grid grid-cols-1 lg:grid-cols-[280px_1fr_300px] gap-4 p-4 max-w-[1400px] w-full mx-auto">
        <LeftPanel budgets={budgets} squads={squads} managers={managers} removeManager={removeManager} />
        <CenterStage
          current={current}
          bidHistory={bidHistory}
          budgets={budgets}
          viewAs={viewAs}
          placeBid={placeBid}
          managers={managers}
        />
        <RightPanel
          viewAs={viewAs}
          pool={pool}
          current={current}
          log={log}
          budgets={budgets}
          squads={squads}
          placeBid={placeBid}
          managers={managers}
          phase={phase}
          startLeague={startLeague}
          simulateEntireAuction={simulateEntireAuction}
        />
      </div>
      )}
      <footer className="text-center text-xs py-3" style={{ color: "var(--muted)" }}>
       
      </footer>
    </div>
  );
}

// ---------- Top bar ----------
function TopBar({ viewAs, setViewAs, poolCount, managers, addManager, phase }) {
  const [joinName, setJoinName] = useState("");

  function handleJoin(e) {
    e.preventDefault();
    const id = addManager(joinName);
    if (id) {
      setViewAs(id);
      setJoinName("");
    }
  }

  return (
    <div className="border-b" style={{ borderColor: "var(--panel-line)", background: "var(--pitch-deep)" }}>
      <div className="max-w-[1400px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-3">
          <span className="display text-3xl leading-none" style={{ color: "var(--gold)", letterSpacing: "0.04em" }}>XOLO</span>
          <span
            className="text-[11px] uppercase tracking-widest px-2.5 py-1 rounded-full"
            style={{ background: "var(--panel)", border: "1px solid var(--panel-line)", color: "var(--muted)" }}
          >
            FRIDAY-FOOTBALL · FTB7X9
          </span>
          <span className="hidden sm:inline text-xs" style={{ color: "var(--muted)" }}>{poolCount} players left</span>
        </div>
        <div className="flex flex-wrap items-center gap-3 text-sm">
          {phase !== "league" && (
          <form onSubmit={handleJoin} className="flex items-center gap-2">
            <label htmlFor="join-name-input" className="sr-only">Your name</label>
            <input
              id="join-name-input"
              value={joinName}
              onChange={e => setJoinName(e.target.value)}
              placeholder="Your name…"
              maxLength={MAX_NAME_LENGTH}
              className="rounded-full px-3 py-1.5 text-sm"
              style={{ background: "var(--panel)", border: "1px solid var(--panel-line)", color: "var(--chalk)" }}
            />
            <button
              type="submit"
              disabled={!joinName.trim()}
              className="btn-pill px-4 py-1.5 text-sm disabled:opacity-40 disabled:cursor-not-allowed"
              style={{ background: "var(--gold)", color: "var(--pitch-deep)" }}
            >
              Join as manager
            </button>
          </form>
          )}
          {viewAs && (
            <span className="text-xs" style={{ color: "var(--muted)" }}>
              Playing as <strong style={{ color: "var(--chalk)" }}>{managers.find(m => m.id === viewAs)?.name ?? "Manager"}</strong> · Auctioneer Bot active
            </span>
          )}
          {!viewAs && managers.length === 0 && phase !== "league" && (
            <span className="text-xs" style={{ color: "var(--muted)" }}>Auctioneer Bot · waiting for managers</span>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------- Center stage: the live auction card ----------

  const isManager = !!viewAs;

  return (
    <div className="card-soft p-6 flex flex-col items-center justify-center text-center min-h-[480px]">
      {!current && (
        <div style={{ color: "var(--muted)" }}>
          <p className="display text-3xl" style={{ color: "var(--chalk)" }}>No player under auction</p>
          <p className="mt-2 text-sm">Waiting for the Auctioneer Bot to start the next player.</p>

        <React.Fragment>
          <div className="text-xs uppercase tracking-widest mb-3" style={{ color: "var(--muted)" }}>
            {current.status === "sold" ? "Sold" : current.status === "unsold" ? "Unsold" : "Player on auction"}
          </div>
          <span className="jersey-badge mb-2" style={{ width: "2.5rem", height: "2.5rem", fontSize: "1.35rem" }}>
            {current.player.rating}
          </span>
          <h1 className="display text-6xl leading-none" style={{ color: "var(--chalk)" }}>{current.player.name}</h1>
          <div className="mt-2 flex flex-wrap gap-1.5 justify-center">
            {[current.player.pos, current.player.club, current.player.nation].map((tag, i) => (
              <span
                key={i}
                className="text-[11px] uppercase tracking-wide px-2.5 py-1 rounded-full"
                style={{ background: "var(--pitch-deep)", border: "1px solid var(--panel-line)", color: "var(--muted)" }}
              >
                {tag}
              </span>
            ))}
          </div>

          <div className="display text-7xl mt-1" style={{ color: "var(--gold)" }}>
            {crFmt(current.bid)}
          </div>
          <div className="text-sm mt-1" style={{ color: current.bidder ? "var(--chalk)" : "var(--muted)" }}>
            {current.bidder ? `Highest bidder: ${managerDisplayName(managers.find(m => m.id === current.bidder))}` : "No bids yet"}
          </div>

          {current.status === "sold" && (
            <div className="mt-4 px-4 py-1 rounded font-semibold" style={{ background: "var(--gold)", color: "var(--pitch-deep)" }} role="status" aria-live="polite">
              SOLD
            </div>
          )}
          {current.status === "unsold" && (
            <div className="mt-4 px-4 py-1 rounded font-semibold" style={{ background: "var(--bid)", color: "#ffffff" }} role="status" aria-live="polite">
              UNSOLD
            </div>
          )}

          {bidHistory.length > 0 && (
            <div className="mt-6 flex flex-wrap gap-2 justify-center">
              {bidHistory.slice(0, 6).map((b, i) => {
                const m = managers.find(mm => mm.id === b.managerId);
                return (
                  <span key={i} className="text-xs px-2 py-1 rounded" style={{ background: "var(--pitch-deep)", border: `1px solid ${m?.color ?? "var(--panel-line)"}` }}>
                    {managerDisplayName(m)} {crFmt(b.amount)}
                  </span>
                );
              })}
            </div>
          )}

          {isManager && current.status === "live" && (
            <React.Fragment>
              <p className="mt-8 text-xs" style={{ color: "var(--muted)" }}>
                Place your bid — the Auctioneer Bot is running the auction. Your budget: {crFmt(budgets[viewAs] || 0)}.
              </p>
              <ManagerBidEntry
                current={current}
                managerId={viewAs}
                budget={budgets[viewAs] || 0}
                placeBid={placeBid}
              />
            </React.Fragment>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

function ManagerBidEntry({ current, managerId, budget, placeBid }) {
  const [amount, setAmount] = useState(current?.bid ?? BID_STEP);

  useEffect(() => {
    setAmount((current?.bid ?? 0) + BID_STEP);
  }, [current?.player?.id, current?.bid]);

  if (!current || current.status !== "live" || !managerId) return null;

  const numericAmount = Number(amount);
  const isValid = Number.isFinite(numericAmount) && numericAmount > current.bid && numericAmount <= budget;

  function submit() {
    if (isValid) placeBid(managerId, numericAmount);
  }

  return (
    <div className="mt-6 pt-4 border-t w-full max-w-md" style={{ borderColor: "var(--panel-line)" }}>
      <div className="flex gap-2">
        <input
          aria-label="Your bid amount in crores"
          type="number"
          min={current.bid + BID_STEP}
          step={1}
          value={amount}
          onChange={e => setAmount(e.target.value)}
          className="flex-1 rounded-full px-3 py-2 text-sm"
          style={{ background: "var(--pitch-deep)", border: "1px solid var(--panel-line)", color: "var(--chalk)" }}
        />
        <button
          onClick={submit}
          disabled={!isValid}
          className="btn-pill px-5 py-2 disabled:opacity-40 disabled:cursor-not-allowed"
          style={{ background: "var(--gold)", color: "var(--pitch-deep)" }}
        >
          Bid {Number.isFinite(numericAmount) ? crFmt(numericAmount) : ""}
        </button>
      </div>
      <p className="mt-2 text-[11px]" style={{ color: "var(--muted)" }}>
        The Auctioneer Bot automatically settles the auction after bidding goes quiet. No countdown is shown.
      </p>
    </div>
  );
}

function RightPanel(props) {
  const { viewAs, log, budgets, squads, managers, phase, startLeague, simulateEntireAuction } = props;
  const currentManager = managers.find(m => m.id === viewAs);

  return (
    <div className="card-soft p-4 flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <h2 className="text-xs uppercase tracking-wide" style={{ color: "var(--muted)" }}>Auctioneer Bot</h2>
        <span className="text-[10px] uppercase tracking-wider px-2 py-1 rounded-full" style={{ background: "var(--gold)", color: "var(--pitch-deep)" }}>ACTIVE</span>
      </div>

      <div className="rounded-lg p-3" style={{ background: "var(--pitch-deep)", border: "1px solid var(--panel-line)" }}>
        <p className="text-sm font-semibold" style={{ color: "var(--chalk)" }}>XOLO Auctioneer</p>
        <p className="text-[11px] mt-1" style={{ color: "var(--muted)" }}>
          The auctioneer is an automated bot. It selects players, generates varied opening prices, runs bidding and resolves SOLD/UNSOLD automatically.
        </p>
      </div>

      {currentManager ? (
        <div className="pt-2 border-t" style={{ borderColor: "var(--panel-line)" }}>
          <h2 className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--muted)" }}>Your status</h2>
          <p className="text-sm" style={{ color: "var(--muted)" }}>
            You are <span style={{ color: "var(--chalk)" }}>{currentManager.name}</span>. Place bids while the Auctioneer Bot runs the auction.
          </p>
        </div>
      ) : (
        <p className="text-xs" style={{ color: "var(--muted)" }}>Enter your name above to join as a manager. The bot will start the auction automatically.</p>
      )}

      {phase === "auction" && (
        <div className="pt-2 border-t flex flex-col gap-2" style={{ borderColor: "var(--panel-line)" }}>
          <h2 className="text-xs uppercase tracking-wide" style={{ color: "var(--muted)" }}>Fast-forward</h2>
          <p className="text-[11px]" style={{ color: "var(--muted)" }}>
            Instantly resolves every remaining player with the existing CPU bidding simulation.
            {managers.length < SIMULATE_TARGET_MANAGERS ? " Adds CPU bot managers first so it's a real contest, even solo." : ""}
          </p>
          <button
            onClick={simulateEntireAuction}
            disabled={managers.length === 0}
            aria-label="Simulate entire auction"
            className="btn-pill py-2.5 px-4 disabled:opacity-40 disabled:cursor-not-allowed"
            style={{ background: "var(--panel-line)", color: "var(--chalk)" }}
          >
            Simulate entire auction
          </button>
        </div>
      )}

      {phase === "auction" && (
        <div className="pt-2 border-t flex flex-col gap-2" style={{ borderColor: "var(--panel-line)" }}>
          <h2 className="text-xs uppercase tracking-wide" style={{ color: "var(--muted)" }}>Premier League</h2>
          <p className="text-[11px]" style={{ color: "var(--muted)" }}>
            Always a full 20-club season — any club nobody drafted plays as a CPU team built from real players.
            {managers.some(m => (squads[m.id] || []).length < SQUAD_SIZE)
              ? " Some of your drafted squads aren't full yet, but you can still start."
              : ""}
          </p>
          <button
            onClick={startLeague}
            disabled={managers.length === 0}
            aria-label="Start Premier League"
            className="btn-pill py-2.5 px-4 disabled:opacity-40 disabled:cursor-not-allowed"
            style={{ background: "var(--gold)", color: "var(--pitch-deep)" }}
          >
            Start Premier League
          </button>
        </div>
      )}

      <div className="pt-2 border-t flex-1 min-h-0" style={{ borderColor: "var(--panel-line)" }}>
        <h2 className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--muted)" }}>Auction log</h2>
        <div className="text-xs space-y-1 max-h-56 overflow-y-auto" style={{ color: "var(--muted)" }} role="log" aria-live="polite" aria-relevant="additions" aria-label="Auction activity log">
          {log.map((l, i) => <p key={i}>{l}</p>)}
        </div>
      </div>
    </div>
  );
}

// ---------- League phase: table + fixtures ----------
function AwardCard({ title, icon, winner, detail }) {
  return (
    <div className="rounded-md p-3" style={{ background: "var(--pitch-deep)", border: "1px solid var(--panel-line)" }}>
      <div className="text-xs uppercase tracking-wide mb-1" style={{ color: "var(--muted)" }}>{icon} {title}</div>
      {winner ? (
        <>
          <div className="font-semibold text-lg leading-tight">{winner.name}</div>
          <div className="text-xs" style={{ color: "var(--muted)" }}>{winner.teamName} · {detail}</div>
        </>
      ) : (
        <div className="text-sm" style={{ color: "var(--muted)" }}>Not yet awarded</div>
      )}
    </div>
  );
}

function LiveMatchTicker({ liveMatch }) {
  if (!liveMatch) return null;
  const runningHome = liveMatch.events.filter(e => e.side === "home").length;
  const runningAway = liveMatch.events.filter(e => e.side === "away").length;
  return (
    <div
      className="rounded-lg p-4"
      style={{ background: "var(--panel)", border: "1px solid var(--gold)" }}
      role="status"
      aria-live="polite"
    >
      <div className="flex items-center justify-between mb-2">
        <span className="text-xs uppercase tracking-wide" style={{ color: "var(--muted)" }}>
          {liveMatch.finished
            ? (liveMatch.penalties ? "Full-time — penalties" : "Full-time")
            : `Live — ${formatMinute(liveMatch.minute || 1)}`}
        </span>
        <span className="text-xs uppercase tracking-wide font-semibold" style={{ color: "var(--gold)" }}>Grudge match</span>
      </div>
      <div className="flex items-center justify-center gap-4 mb-3">
        <span className="font-semibold text-lg text-right flex-1" style={{ color: liveMatch.homeColor }}>{liveMatch.homeName}</span>
        <span className="display text-3xl px-2" style={{ color: "var(--chalk)" }}>{runningHome} – {runningAway}</span>
        <span className="font-semibold text-lg flex-1" style={{ color: liveMatch.awayColor }}>{liveMatch.awayName}</span>
      </div>
      <ul className="space-y-1 text-sm max-h-40 overflow-y-auto">
        {liveMatch.events.length === 0 && !liveMatch.finished && (
          <li className="text-center" style={{ color: "var(--muted)" }}>Kick-off…</li>
        )}
        {liveMatch.events.map((ev, i) => (
          <li key={i} className="flex justify-between gap-2">
            <span style={{ color: "var(--muted)" }}>{formatMinute(ev.minute)}</span>
            <span>⚽ {ev.scorer.name} <span style={{ color: "var(--muted)" }}>({ev.side === "home" ? liveMatch.homeName : liveMatch.awayName})</span></span>
          </li>
        ))}
      </ul>
      {liveMatch.finished && liveMatch.penalties && (
        <div className="mt-3 pt-3 text-sm" style={{ borderTop: "1px solid var(--panel-line)" }}>
          <div className="font-semibold mb-1">
            🥅 Penalties: {liveMatch.penalties.homeScore} – {liveMatch.penalties.awayScore}
          </div>
          <div style={{ color: "var(--muted)" }}>
            {liveMatch.penalties.winnerSide === "home" ? liveMatch.homeName : liveMatch.awayName} win the shootout — bragging rights only, the league table still records this as a draw.
          </div>
        </div>
      )}
    </div>
  );
}

function LeagueView({ teams, fixtures, simulateMatchday, simulateFullSeason, viewAs, lastSimulatedKeys, liveMatch }) {
  const standings = computeStandings(teams, fixtures);
  const byId = Object.fromEntries(teams.map(t => [t.id, t]));
  const nextUnplayed = fixtures.findIndex(md => md.some(f => isRealFixture(f) && !f.played));
  const hasUnplayed = nextUnplayed !== -1;
  const seasonComplete = !hasUnplayed && fixtures.length > 0;
  const isAuctioneer = true; // league simulation is controlled by the game/Auctioneer Bot, not a human role
  const liveSet = new Set(lastSimulatedKeys || []);
  const awards = computeSeasonAwards(teams, fixtures);

  return (
    <div className="flex-1 flex flex-col gap-4 p-4 max-w-[1400px] w-full mx-auto">
      <LiveMatchTicker liveMatch={liveMatch} />
      {seasonComplete && (
        <div
          className="rounded-lg p-4"
          style={{ background: "var(--panel)", border: "1px solid var(--gold)" }}
          role="status"
          aria-live="polite"
        >
          <h2 className="display text-3xl leading-none mb-3" style={{ color: "var(--gold)" }}>Season Awards</h2>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <AwardCard
              title="Golden Boot"
              icon="⚽"
              winner={awards.goldenBoot}
              detail={awards.goldenBoot ? `${awards.goldenBoot.goals} goal${awards.goldenBoot.goals === 1 ? "" : "s"}` : ""}
            />
            <AwardCard
              title="Golden Glove"
              icon="🧤"
              winner={awards.goldenGlove}
              detail={awards.goldenGlove ? `${awards.goldenGlove.cleanSheets} clean sheet${awards.goldenGlove.cleanSheets === 1 ? "" : "s"}` : ""}
            />
            <AwardCard
              title="Player of the Season"
              icon="🏆"
              winner={awards.playerOfSeason}
              detail={awards.playerOfSeason ? `${awards.playerOfSeason.points} pts` : ""}
            />
          </div>
        </div>
      )}
      <div className="grid grid-cols-1 lg:grid-cols-[1fr_1fr] gap-4">
      <div className="flex flex-col gap-4">
      <div className="card-soft p-4 overflow-x-auto">
        <div className="flex items-baseline justify-between gap-2 mb-3">
          <h2 className="display text-3xl leading-none" style={{ color: "var(--gold)" }}>Premier League</h2>
          <span className="text-xs uppercase tracking-wide" style={{ color: "var(--muted)" }}>Table</span>
        </div>
        <table className="w-full text-sm" style={{ color: "var(--chalk)" }}>
          <thead>
            <tr className="text-left text-xs uppercase tracking-wide" style={{ color: "var(--muted)" }}>
              <th className="py-2 pr-2">Pos</th>
              <th className="py-2 pr-2">Team</th>
              <th className="py-2 pr-1 text-right">P</th>
              <th className="py-2 pr-1 text-right">W</th>
              <th className="py-2 pr-1 text-right">D</th>
              <th className="py-2 pr-1 text-right">L</th>
              <th className="py-2 pr-1 text-right">GF</th>
              <th className="py-2 pr-1 text-right">GA</th>
              <th className="py-2 pr-1 text-right">GD</th>
              <th className="py-2 text-right">Pts</th>
            </tr>
          </thead>
          <tbody>
            {standings.map((row, i) => {
              const t = byId[row.id];
              const isYou = !!t && t.managerId === viewAs;
              return (
                <tr key={row.id} style={{ borderTop: "1px solid var(--panel-line)", background: isYou ? "var(--pitch-deep)" : "transparent" }}>
                  <td className="py-2 pr-2">{i + 1}</td>
                  <td className="py-2 pr-2 font-semibold" style={{ color: t?.color || "var(--chalk)" }}>
                    {row.name}
                    {t?.isCpu && (
                      <span className="ml-1.5 text-[10px] font-normal uppercase tracking-wide px-1 py-0.5 rounded" style={{ background: "var(--panel-line)", color: "var(--muted)" }}>CPU</span>
                    )}
                    {isYou && (
                      <span className="ml-1.5 text-[10px] font-normal uppercase tracking-wide px-1 py-0.5 rounded" style={{ background: "var(--gold)", color: "var(--pitch-deep)" }}>You</span>
                    )}
                  </td>
                  <td className="py-2 pr-1 text-right">{row.Played}</td>
                  <td className="py-2 pr-1 text-right">{row.Won}</td>
                  <td className="py-2 pr-1 text-right">{row.Drawn}</td>
                  <td className="py-2 pr-1 text-right">{row.Lost}</td>
                  <td className="py-2 pr-1 text-right">{row.GoalsFor}</td>
                  <td className="py-2 pr-1 text-right">{row.GoalsAgainst}</td>
                  <td className="py-2 pr-1 text-right">{row.GoalDifference > 0 ? `+${row.GoalDifference}` : row.GoalDifference}</td>
                  <td className="py-2 text-right font-semibold">{row.Points}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
        {isAuctioneer && hasUnplayed && (
          <button
            onClick={simulateFullSeason}
            disabled={!!liveMatch}
            aria-label="Simulate rest of season"
            className="mt-4 btn-pill py-2 px-4 disabled:opacity-40 disabled:cursor-not-allowed"
            style={{ background: "var(--panel-line)", color: "var(--chalk)" }}
          >
            Simulate rest of season
          </button>
        )}
      </div>

      <div className="card-soft p-4">
        <h2 className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--muted)" }}>Top Scorers</h2>
        {awards.topScorers.length === 0 ? (
          <p className="text-sm" style={{ color: "var(--muted)" }}>No goals yet.</p>
        ) : (
          <ol className="space-y-1 text-sm">
            {awards.topScorers.slice(0, 8).map((p, i) => (
              <li key={p.id} className="flex items-center justify-between gap-2">
                <span>{i + 1}. {p.name} <span className="text-xs" style={{ color: "var(--muted)" }}>({p.teamName})</span></span>
                <span className="font-semibold">{p.goals}</span>
              </li>
            ))}
          </ol>
        )}
      </div>
      </div>

      <div className="card-soft p-4 space-y-4">
        <h2 className="text-xs uppercase tracking-wide" style={{ color: "var(--muted)" }}>Fixtures</h2>
        <div className="space-y-4 max-h-[70vh] overflow-y-auto">
          {fixtures.map((matchday, mdIndex) => (
            <div key={mdIndex}>
              <div className="flex items-center justify-between gap-2 mb-2">
                <h3 className="text-sm font-semibold">Matchday {mdIndex + 1}</h3>
                {isAuctioneer && mdIndex === nextUnplayed && (
                  <button
                    onClick={() => simulateMatchday(mdIndex)}
                    disabled={!!liveMatch}
                    aria-label={`Simulate matchday ${mdIndex + 1}`}
                    className="btn-pill px-3 py-1 text-sm disabled:opacity-40 disabled:cursor-not-allowed"
                    style={{ background: "var(--gold)", color: "var(--pitch-deep)" }}
                  >
                    Simulate this matchday
                  </button>
                )}
              </div>
              <ul className="space-y-1">
                {matchday.filter(isRealFixture).map(f => {
                  const home = clubName(byId[f.home]);
                  const away = clubName(byId[f.away]);
                  const key = fixtureKey(mdIndex, f);
                  const live = liveSet.has(key);
                  return (
                    <li
                      key={key}
                      className="text-sm rounded px-2 py-1.5"
                      style={{ background: "var(--pitch-deep)", border: "1px solid var(--panel-line)" }}
                      {...(live ? { role: "status", "aria-live": "polite" } : {})}
                    >
                      <div className="flex items-center gap-2">
                        <span>
                          {f.played
                            ? `${home} ${f.homeGoals} – ${f.awayGoals} ${away}`
                            : `${home} vs ${away}`}
                          {f.played && f.penalties && ` (pens ${f.penalties.homeScore}-${f.penalties.awayScore})`}
                        </span>
                        {f.isPvP && (
                          <span className="text-[10px] uppercase tracking-wide px-1 py-0.5 rounded" style={{ background: "var(--panel-line)", color: "var(--gold)" }}>PvP</span>
                        )}
                      </div>
                      {f.played && (f.timeline?.length > 0) && (
                        <div className="mt-1 text-xs" style={{ color: "var(--muted)" }}>
                          {summarizeTimelineSide(f.timeline, "home") && <div>⚽ {summarizeTimelineSide(f.timeline, "home")}</div>}
                          {summarizeTimelineSide(f.timeline, "away") && <div>⚽ {summarizeTimelineSide(f.timeline, "away")}</div>}
                        </div>
                      )}
                      {f.played && f.penalties && (
                        <div className="mt-1 text-xs" style={{ color: "var(--gold)" }}>
                          🥅 {(f.penalties.winnerSide === "home" ? home : away)} win on penalties
                        </div>
                      )}
                    </li>
                  );
                })}
              </ul>
            </div>
          ))}
        </div>
      </div>
    </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
