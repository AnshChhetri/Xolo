function shuffleList(list) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

// Shuffled once per page load so join order isn't alphabetical every session.
const SESSION_CLUB_ORDER = shuffleList(PREMIER_LEAGUE_CLUBS_2026_27);

function pickNextClub(currentManagers) {
  const taken = new Set((currentManagers || []).map(m => m.club).filter(Boolean));
  return SESSION_CLUB_ORDER.find(c => !taken.has(c))
    || PREMIER_LEAGUE_CLUBS_2026_27.find(c => !taken.has(c))
    || "Arsenal";
}

function clubName(manager) {
  if (!manager) return "Unknown";
  return manager.club || `${manager.name} FC`;
}

function managerLabel(manager) {
  if (!manager) return "Unknown";
  if (manager.bot) return `${clubName(manager)} (CPU)`;
  return `${clubName(manager)} (${manager.name})`;
}

// Bots are named after their club, so managerLabel/(m.name) would read "Arsenal (Arsenal)" —
// this gives a cleaner "Arsenal (CPU)" for bots and falls back to the human's name otherwise.
function managerDisplayName(manager) {
  if (!manager) return "Unknown";
  return manager.bot ? `${manager.name} (CPU)` : manager.name;
}

const START_BUDGET = 100; // Cr
const SQUAD_SIZE = 11;
const BID_STEP = 1;
const TIMER_SECONDS = 15;
const INITIAL_DEFAULT_BASE = 10; // Cr — auctioneer can change this at setup and any time after

function crFmt(n) {
  return `₹${n.toLocaleString("en-IN")} Cr`;
}

const XI_TARGETS = {
  GK: 1, CB: 2, LB: 1, RB: 1, CDM: 1, CM: 1, CAM: 1, LW: 1, RW: 1, ST: 1,
};

function positionNeedFactor(squad, pos) {
  const list = squad || [];
  const have = list.filter(p => p.pos === pos).length;
  const target = XI_TARGETS[pos] || 1;
  const slots = SQUAD_SIZE - list.length;
  if (slots <= 0) return 0;
  if (have < target) return 1.4;
  let missingOther = 0;
  Object.keys(XI_TARGETS).forEach(p => {
    if (p === pos) return;
    const n = list.filter(x => x.pos === p).length;
    missingOther += Math.max(0, XI_TARGETS[p] - n);
  });
  if (missingOther >= slots) return 0;
  return 0.35;
}

function cpuMaxBid(player, base, budget, squad, remainingPool) {
  const slots = SQUAD_SIZE - (squad || []).length;
  if (slots <= 0 || budget < base) return 0;
  const need = positionNeedFactor(squad, player.pos);
  if (need <= 0) return 0;
  const ratings = (remainingPool || []).map(p => Number(p.rating) || 0);
  const poolAvg = ratings.length ? ratings.reduce((a, b) => a + b, 0) / ratings.length : 80;
  const rel = ((Number(player.rating) || 0) - poolAvg) / 12;
  const ratingFactor = 0.75 + Math.max(-0.2, Math.min(0.85, rel));
  const eliteBump = (Number(player.rating) || 0) >= 88 ? 1.35 : 1;
  let cap = Math.floor((budget / slots) * need * ratingFactor * eliteBump);
  cap = Math.floor(cap * (0.85 + Math.random() * 0.3));
  cap = Math.min(budget, Math.max(0, cap));
  return cap >= base ? cap : 0;
}

function cpuAuctionOne(player, base, managers, budgets, squads, remainingPool) {
  const caps = {};
  managers.forEach(m => {
    caps[m.id] = cpuMaxBid(player, base, budgets[m.id], squads[m.id], remainingPool);
  });
  let interested = managers.filter(m =>
    caps[m.id] >= base && budgets[m.id] >= base && (squads[m.id] || []).length < SQUAD_SIZE
  );
  if (interested.length === 0) return { sold: false };

  let price = base;
  let bidder = interested.length === 1 ? interested[0].id : null;
  if (interested.length === 1) return { sold: true, bidder, price };

  let guard = 0;
  while (interested.length > 1 && guard < 400) {
    guard += 1;
    const jump = Math.random() < 0.3 ? BID_STEP + Math.ceil(Math.random() * 2) : BID_STEP;
    const nextPrice = price + jump;
    const still = interested.filter(m =>
      caps[m.id] >= nextPrice && budgets[m.id] >= nextPrice && (squads[m.id] || []).length < SQUAD_SIZE
    );
    if (still.length === 0) break;
    still.sort((a, b) => (caps[b.id] - nextPrice) - (caps[a.id] - nextPrice));
    bidder = still[0].id;
    price = nextPrice;
    interested = still;
    if (still.length === 1) break;
  }
  if (!bidder) return { sold: false };
  return { sold: true, bidder, price };
}

function executeCpuAuction({ pool, managers, budgets, squads, defaultBasePrice, current }) {
  const nextBudgets = { ...budgets };
  const nextSquads = {};
  managers.forEach(m => {
    nextSquads[m.id] = [...(squads[m.id] || [])];
  });
  let nextPool = [...pool];
  const logs = [];

  function labelOf(id) {
    return managerLabel(managers.find(m => m.id === id));
  }

  if (current && current.status === "live") {
    const player = current.player;
    if (current.bidder) {
      const mid = current.bidder;
      nextBudgets[mid] = nextBudgets[mid] - current.bid;
      nextSquads[mid].push({ ...player, price: current.bid });
      nextPool = nextPool.filter(p => p.id !== player.id);
      logs.push(`SOLD — ${player.name} to ${labelOf(mid)} for ${crFmt(current.bid)}.`);
    } else {
      logs.push(`${player.name} went UNSOLD — no bids.`);
    }
  }

  const toSell = [...nextPool];
  toSell.forEach(player => {
    if (!nextPool.some(p => p.id === player.id)) return;
    const override = current && current.player && current.player.id === player.id && Number(current.base) > 0
      ? Number(current.base)
      : defaultBasePrice;
    const result = cpuAuctionOne(player, override, managers, nextBudgets, nextSquads, nextPool);
    if (result.sold) {
      nextBudgets[result.bidder] -= result.price;
      nextSquads[result.bidder].push({ ...player, price: result.price });
      nextPool = nextPool.filter(p => p.id !== player.id);
      logs.push(`SOLD — ${player.name} to ${labelOf(result.bidder)} for ${crFmt(result.price)}.`);
    } else {
      logs.push(`${player.name} went UNSOLD — no bids.`);
    }
  });

  return { nextPool, nextBudgets, nextSquads, logs };
}

// After the competitive CPU bidding above, budget constraints can leave some managers short
// of a full XI (they simply couldn't afford or win enough players). This pass tops every
// manager up to exactly SQUAD_SIZE using whatever's left in the pool, favouring positions
// they're still missing, and charging whatever they can still afford (as low as ₹0 if a
// manager is broke) so "Simulate entire auction" always finishes with complete squads.
function neededPositionsFor(squad) {
  const need = new Set();
  Object.keys(XI_TARGETS).forEach(pos => {
    const have = (squad || []).filter(p => p.pos === pos).length;
    if (have < XI_TARGETS[pos]) need.add(pos);
  });
  return need;
}

function backfillSquads({ managers, budgets, squads, pool, defaultBasePrice }) {
  const remainingPool = [...pool];
  const nextBudgets = { ...budgets };
  const nextSquads = {};
  managers.forEach(m => {
    nextSquads[m.id] = [...(squads[m.id] || [])];
  });
  const addedCount = {};
  const addedCost = {};

  let needer = shuffleList(managers.filter(m => nextSquads[m.id].length < SQUAD_SIZE));
  let guard = 0;
  while (needer.length > 0 && remainingPool.length > 0 && guard < 5000) {
    guard += 1;
    for (const m of needer) {
      if (nextSquads[m.id].length >= SQUAD_SIZE || remainingPool.length === 0) continue;
      const need = neededPositionsFor(nextSquads[m.id]);
      let idx = remainingPool.findIndex(p => need.has(p.pos));
      if (idx === -1) idx = 0;
      const player = remainingPool[idx];
      const price = Math.max(0, Math.min(defaultBasePrice, nextBudgets[m.id]));
      nextBudgets[m.id] -= price;
      nextSquads[m.id].push({ ...player, price });
      remainingPool.splice(idx, 1);
      addedCount[m.id] = (addedCount[m.id] || 0) + 1;
      addedCost[m.id] = (addedCost[m.id] || 0) + price;
    }
    needer = needer.filter(m => nextSquads[m.id].length < SQUAD_SIZE);
  }

  const logs = managers
    .filter(m => addedCount[m.id])
    .map(m => `Auto-filled ${addedCount[m.id]} more player${addedCount[m.id] === 1 ? "" : "s"} for ${managerLabel(m)} to complete their XI (${crFmt(addedCost[m.id])} total).`);

  const shortfall = managers.filter(m => nextSquads[m.id].length < SQUAD_SIZE);
  if (shortfall.length > 0) {
    logs.push(`Not enough players left in the pool to fully complete ${shortfall.length} squad${shortfall.length === 1 ? "" : "s"} (${shortfall.map(m => managerLabel(m)).join(", ")}).`);
  }

  return { nextPool: remainingPool, nextBudgets, nextSquads, logs };
}

function makeManagerId() {
  return `m_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
}

// When simulating an auction with too few managers to be a real contest (e.g. a solo player),
// we top the room up to this many seats with CPU bots before running the simulation. Bots bid
// generally and competitively for any player (via cpuMaxBid/cpuAuctionOne below) — they are not
// restricted to players who actually play for their assigned club.
const SIMULATE_TARGET_MANAGERS = 8;

function addBotManagers(existingManagers, targetCount) {
  const bots = [];
  let running = [...existingManagers];
  const cap = Math.min(targetCount, MAX_MANAGERS);
  while (running.length < cap) {
    const club = pickNextClub(running);
    const bot = {
      id: makeManagerId(),
      name: club,
      color: MANAGER_COLORS[running.length % MANAGER_COLORS.length],
      club,
      bot: true,
    };
    bots.push(bot);
    running = [...running, bot];
  }
  return bots;
}

// The Premier League season always features all 20 real clubs, regardless of how many
// people actually took part in the auction. A club a manager drafted uses that manager's
// actual won squad; any club nobody claimed gets a CPU-only team built from real players in
// the pool who genuinely play for that club (padded with generic reserves if the pool doesn't
// have a full XI's worth for them). These CPU-only teams are kept separate from the auction's
// managers/budgets/squads state — they never touch anyone's budget or the draft pool.
function buildLeagueTeams(managers, squads) {
  const claimedByClub = {};
  managers.forEach(m => {
    if (m.club) claimedByClub[m.club] = m;
  });

  return PREMIER_LEAGUE_CLUBS_2026_27.map(club => {
    const manager = claimedByClub[club];
    if (manager) {
      return {
        id: club,
        club,
        managerId: manager.id,
        managerName: manager.name,
        isCpu: !!manager.bot,
        color: manager.color,
        squad: squads[manager.id] || [],
      };
    }

    const realPlayers = PLAYER_POOL
      .filter(p => p.club === club)
      .sort((a, b) => b.rating - a.rating);
    const squad = realPlayers.slice(0, SQUAD_SIZE).map(p => ({ ...p }));
    if (squad.length < SQUAD_SIZE) {
      const avg = squad.length ? averageRating(squad) : 76;
      const missing = SQUAD_SIZE - squad.length;
      for (let i = 0; i < missing; i++) {
        squad.push({
          id: `filler_${club}_${i}`,
          name: `${club} Reserve`,
          pos: Object.keys(XI_TARGETS)[i % Object.keys(XI_TARGETS).length],
          club,
          nation: "—",
          rating: Math.max(58, Math.round(avg - 4 - i)),
        });
      }
    }

    return {
      id: club,
      club,
      managerId: null,
      managerName: null,
      isCpu: true,
      color: null,
      squad,
    };
  });
}

const BYE_ID = "BYE";

function generateFixtures(managerIds) {
  const ids = [...managerIds];
  if (ids.length < 2) return [];
  if (ids.length % 2 === 1) ids.push(BYE_ID);

  const n = ids.length;
  const rounds = n - 1;
  let circle = [...ids];
  const firstLeg = [];

  for (let r = 0; r < rounds; r++) {
    const matchday = [];
    for (let i = 0; i < n / 2; i++) {
      const home = circle[i];
      const away = circle[n - 1 - i];
      if (home === BYE_ID || away === BYE_ID) continue;
      matchday.push({ home, away, played: false, homeGoals: null, awayGoals: null });
    }
    firstLeg.push(matchday);
    // Circle method: keep index 0 fixed, rotate the rest.
    circle = [circle[0], circle[n - 1], ...circle.slice(1, n - 1)];
  }

  const secondLeg = firstLeg.map(matchday =>
    matchday.map(f => ({
      home: f.away,
      away: f.home,
      played: false,
      homeGoals: null,
      awayGoals: null,
    }))
  );

  return [...firstLeg, ...secondLeg];
}

function averageRating(squad) {
  if (!squad || squad.length === 0) return 65;
  const sum = squad.reduce((acc, p) => acc + (Number(p.rating) || 0), 0);
  return sum / squad.length;
}

function poissonKnuth(lambda) {
  const L = Math.exp(-Math.max(0, lambda));
  let k = 0;
  let p = 1;
  do {
    k += 1;
    p *= Math.random();
  } while (p > L);
  return k - 1;
}

function simulateScore(ratingA, ratingB) {
  const BASE_XG = 1.4;
  const perPoint = 0.05;
  const diff = (Number(ratingA) || 0) - (Number(ratingB) || 0);
  const clamp = n => Math.min(4, Math.max(0.2, n));
  const homeXg = clamp(BASE_XG + diff * perPoint);
  const awayXg = clamp(BASE_XG - diff * perPoint);
  return { homeGoals: poissonKnuth(homeXg), awayGoals: poissonKnuth(awayXg) };
}

function isRealFixture(f) {
  return f && f.home !== BYE_ID && f.away !== BYE_ID;
}

function computeStandings(teams, fixtures) {
  const rows = {};
  teams.forEach(t => {
    rows[t.id] = {
      id: t.id,
      name: t.club,
      Played: 0,
      Won: 0,
      Drawn: 0,
      Lost: 0,
      GoalsFor: 0,
      GoalsAgainst: 0,
      GoalDifference: 0,
      Points: 0,
    };
  });

  (fixtures || []).forEach(matchday => {
    (matchday || []).forEach(f => {
      if (!f.played || !isRealFixture(f)) return;
      const home = rows[f.home];
      const away = rows[f.away];
      if (!home || !away) return;
      home.Played += 1;
      away.Played += 1;
      home.GoalsFor += f.homeGoals;
      home.GoalsAgainst += f.awayGoals;
      away.GoalsFor += f.awayGoals;
      away.GoalsAgainst += f.homeGoals;
      if (f.homeGoals > f.awayGoals) {
        home.Won += 1;
        away.Lost += 1;
        home.Points += 3;
      } else if (f.homeGoals < f.awayGoals) {
        away.Won += 1;
        home.Lost += 1;
        away.Points += 3;
      } else {
        home.Drawn += 1;
        away.Drawn += 1;
        home.Points += 1;
        away.Points += 1;
      }
    });
  });

  return Object.values(rows)
    .map(row => ({ ...row, GoalDifference: row.GoalsFor - row.GoalsAgainst }))
    .sort((a, b) => {
      if (b.Points !== a.Points) return b.Points - a.Points;
      if (b.GoalDifference !== a.GoalDifference) return b.GoalDifference - a.GoalDifference;
      if (b.GoalsFor !== a.GoalsFor) return b.GoalsFor - a.GoalsFor;
      return a.name.localeCompare(b.name);
    });
}

function fixtureKey(matchdayIndex, f) {
  return `${matchdayIndex}:${f.home}:${f.away}`;
}

function playMatchday(matchdays, index, squadsByManager) {
  return matchdays.map((matchday, i) => {
    if (i !== index) return matchday;
    return matchday.map(f => {
      if (f.played || !isRealFixture(f)) return f;
      const { homeGoals, awayGoals } = simulateScore(
        averageRating(squadsByManager[f.home]),
        averageRating(squadsByManager[f.away])
      );
      return { ...f, played: true, homeGoals, awayGoals };
    });
  });
}

// ---------- Root ----------
function App() {
  const [viewAs, setViewAs] = useState("auctioneer"); // "auctioneer" | manager id
  const [pool, setPool] = useState(PLAYER_POOL);
  const [defaultBasePrice, setDefaultBasePriceState] = useState(INITIAL_DEFAULT_BASE);
  const [current, setCurrent] = useState(null); // { player, base, bid, bidder, status: 'idle'|'live'|'sold'|'unsold' }
  const [timeLeft, setTimeLeft] = useState(TIMER_SECONDS);
  const [running, setRunning] = useState(false);
  const [managers, setManagers] = useState([]); // { id, name, color }
  const [budgets, setBudgets] = useState({});
  const [squads, setSquads] = useState({});
  const [bidHistory, setBidHistory] = useState([]);
  const [log, setLog] = useState(["Room created. Waiting for auctioneer to select a player."]);
  const [phase, setPhase] = useState("auction");
  const [fixtures, setFixtures] = useState([]);
  const [lastSimulatedKeys, setLastSimulatedKeys] = useState([]);
  const [leagueTeams, setLeagueTeams] = useState([]); // all 20 PL clubs — drafted ones use the manager's squad, the rest are CPU-only
  const timerRef = useRef(null);

  useEffect(() => {
    if (running && timeLeft > 0) {
      timerRef.current = setTimeout(() => setTimeLeft(t => t - 1), 1000);
    } else if (running && timeLeft === 0) {
      finishAuction();
    }
    return () => clearTimeout(timerRef.current);
  }, [running, timeLeft]);

  function addLog(msg) {
    setLog(l => [msg, ...l].slice(0, 30));
  }

  function addManager(rawName) {
    const name = (rawName || "").trim().slice(0, MAX_NAME_LENGTH);
    if (!name) {
      addLog("Enter a name to join as a manager.");
      return null;
    }
    if (managers.length >= MAX_MANAGERS) {
      addLog(`The manager list is full (max ${MAX_MANAGERS}).`);
      return null;
    }
    if (managers.some(m => m.name.toLowerCase() === name.toLowerCase())) {
      addLog(`"${name}" is already in the auction — try a different name.`);
      return null;
    }
    const id = makeManagerId();
    const color = MANAGER_COLORS[managers.length % MANAGER_COLORS.length];
    const club = pickNextClub(managers);
    setManagers(list => [...list, { id, name, color, club }]);
    setBudgets(b => ({ ...b, [id]: START_BUDGET }));
    setSquads(s => ({ ...s, [id]: [] }));
    addLog(`${name} joined the auction.`);
    return id;
  }

  function removeManager(id) {
    const m = managers.find(mm => mm.id === id);
    if (!m) return;
    if (squads[id] && squads[id].length > 0) {
      addLog(`Can't remove ${m.name} — they already own players.`);
      return;
    }
    if (current && current.bidder === id) {
      addLog(`Can't remove ${m.name} — they're the current highest bidder.`);
      return;
    }
    setManagers(list => list.filter(mm => mm.id !== id));
    setBudgets(b => {
      const rest = { ...b };
      delete rest[id];
      return rest;
    });
    setSquads(s => {
      const rest = { ...s };
      delete rest[id];
      return rest;
    });
    if (viewAs === id) setViewAs("auctioneer");
    addLog(`${m.name} left the auction.`);
  }

  function selectPlayer(player) {
    if (running) return;
    setCurrent({ player, base: defaultBasePrice, bid: defaultBasePrice, bidder: null, status: "idle" });
    setTimeLeft(TIMER_SECONDS);
    setBidHistory([]);
    addLog(`Auctioneer selected ${player.name}. Base price set to ${crFmt(defaultBasePrice)} (default — adjustable before the auction starts).`);
  }

  function setDefaultBasePrice(amount) {
    const n = Number(amount);
    if (!Number.isFinite(n) || n <= 0) {
      addLog("Enter a default base price greater than 0.");
      return;
    }
    setDefaultBasePriceState(n);
    addLog(`Default base price set to ${crFmt(n)}. Applies to players selected from now on.`);
  }

  function updateBasePrice(amount) {
    if (!current || current.status !== "idle") return; // only editable before the auction goes live
    const n = Number(amount);
    if (!Number.isFinite(n) || n <= 0) {
      addLog("Enter a base price greater than 0.");
      return;
    }
    setCurrent(c => ({ ...c, base: n, bid: n }));
    addLog(`Base price for ${current.player.name} overridden to ${crFmt(n)}.`);
  }

  function startAuction() {
    if (!current) return;
    if (managers.length === 0) {
      addLog("Add at least one manager before starting the auction.");
      return;
    }
    setRunning(true);
    setCurrent(c => ({ ...c, status: "live" }));
    addLog(`Auction started for ${current.player.name}.`);
  }

  function pauseAuction() {
    setRunning(false);
    addLog("Auction paused by auctioneer.");
  }

  function resumeAuction() {
    if (!current) return;
    setRunning(true);
    addLog("Auction resumed.");
  }

  function placeBid(managerId, amount) {
    if (!current || current.status !== "live") return;
    // If the auctioneer doesn't specify an amount, fall back to the standard +1 step
    // (used by the manager quick-bid button). Otherwise the auctioneer's own figure wins.
    const bidAmount = amount !== undefined && amount !== null && amount !== ""
      ? Number(amount)
      : current.bid + BID_STEP;

    if (!Number.isFinite(bidAmount) || bidAmount <= current.bid) {
      addLog(`Bid rejected — ${Number.isFinite(bidAmount) ? crFmt(bidAmount) : "that amount"} is not higher than the current bid of ${crFmt(current.bid)}.`);
      return;
    }
    if (budgets[managerId] < bidAmount) {
      addLog(`${label(managerId)} tried to bid but doesn't have enough budget.`);
      return;
    }
    if (squads[managerId].length >= SQUAD_SIZE) {
      addLog(`${label(managerId)} squad is already full.`);
      return;
    }
    setCurrent(c => ({ ...c, bid: bidAmount, bidder: managerId }));
    setBidHistory(h => [{ managerId, amount: bidAmount }, ...h]);
    setTimeLeft(TIMER_SECONDS); // reset timer on new bid, like a live auction
    addLog(`${label(managerId)} bids ${crFmt(bidAmount)}.`);
  }

  function label(id) {
    return managerDisplayName(managers.find(m => m.id === id)) ?? id;
  }

  function finishAuction() {
    setRunning(false);
    if (!current) return;
    if (current.bidder) {
      const mid = current.bidder;
      setBudgets(b => ({ ...b, [mid]: b[mid] - current.bid }));
      setSquads(s => ({ ...s, [mid]: [...s[mid], { ...current.player, price: current.bid }] }));
      setCurrent(c => ({ ...c, status: "sold" }));
      addLog(`SOLD — ${current.player.name} to ${label(mid)} for ${crFmt(current.bid)}.`);
      setPool(p => p.filter(pl => pl.id !== current.player.id));
    } else {
      setCurrent(c => ({ ...c, status: "unsold" }));
      addLog(`${current.player.name} went UNSOLD — no bids.`);
    }
  }

  function markSoldNow() {
    setRunning(false);
    finishAuction();
  }

  function skipPlayer() {
    if (!current) return;
    setRunning(false);
    addLog(`${current.player.name} skipped by auctioneer.`);
    setCurrent(null);
  }

  function simulateEntireAuction() {
    if (managers.length === 0) {
      addLog("Add yourself as a manager before simulating the auction.");
      return;
    }
    setRunning(false);

    // Snapshot the state we'll simulate against. If it's currently a solo (or near-solo) room,
    // top it up with CPU bot managers first so there's real competition for every player.
    let simManagers = managers;
    let simBudgets = budgets;
    let simSquads = squads;

    if (managers.length < SIMULATE_TARGET_MANAGERS) {
      const bots = addBotManagers(managers, SIMULATE_TARGET_MANAGERS);
      if (bots.length > 0) {
        simManagers = [...managers, ...bots];
        simBudgets = { ...budgets };
        simSquads = { ...squads };
        bots.forEach(b => {
          simBudgets[b.id] = START_BUDGET;
          simSquads[b.id] = [];
        });
        setManagers(simManagers);
        setBudgets(simBudgets);
        setSquads(simSquads);
        addLog(`Added ${bots.length} CPU bot manager${bots.length === 1 ? "" : "s"} for real competition, then simulated the rest of the auction.`);
      }
    }

    const result = executeCpuAuction({
      pool,
      managers: simManagers,
      budgets: simBudgets,
      squads: simSquads,
      defaultBasePrice,
      current,
    });

    // Competitive bidding alone can leave some managers short of a full XI if their budget
    // runs dry — top everyone up to SQUAD_SIZE from what's left in the pool.
    const filled = backfillSquads({
      managers: simManagers,
      budgets: result.nextBudgets,
      squads: result.nextSquads,
      pool: result.nextPool,
      defaultBasePrice,
    });

    setPool(filled.nextPool);
    setBudgets(filled.nextBudgets);
    setSquads(filled.nextSquads);
    setCurrent(null);
    setBidHistory([]);
    setLog(l => [...[...filled.logs].reverse(), ...[...result.logs].reverse(), ...l].slice(0, 30));
  }

  function startLeague() {
    // The season always runs as a full 20-club Premier League. Any club a manager actually
    // drafted uses their real squad; every other club is filled by a CPU-only team.
    const teams = buildLeagueTeams(managers, squads);
    setLeagueTeams(teams);
    setFixtures(generateFixtures(teams.map(t => t.id)));
    setLastSimulatedKeys([]);
    setPhase("league");
    const cpuCount = teams.filter(t => !t.managerId).length;
    addLog(cpuCount > 0
      ? `Premier League started — all 20 clubs are in, with ${cpuCount} CPU team${cpuCount === 1 ? "" : "s"} filling the clubs nobody drafted.`
      : "Premier League started — all 20 clubs are in.");
  }

  function simulateMatchday(index) {
    const squadsByTeam = Object.fromEntries(leagueTeams.map(t => [t.id, t.squad]));
    const before = fixtures[index] || [];
    const keys = before.filter(f => isRealFixture(f) && !f.played).map(f => fixtureKey(index, f));
    setLastSimulatedKeys(keys);
    setFixtures(prev => playMatchday(prev, index, squadsByTeam));
    addLog(`Matchday ${index + 1} simulated.`);
  }

  function simulateFullSeason() {
    const squadsByTeam = Object.fromEntries(leagueTeams.map(t => [t.id, t.squad]));
    const keys = [];
    fixtures.forEach((matchday, i) => {
      matchday.forEach(f => {
        if (isRealFixture(f) && !f.played) keys.push(fixtureKey(i, f));
      });
    });
    setLastSimulatedKeys(keys);
    setFixtures(prev => {
      let next = prev;
      for (let i = 0; i < next.length; i++) {
        const hadUnplayed = (next[i] || []).some(f => isRealFixture(f) && !f.played);
        if (hadUnplayed) next = playMatchday(next, i, squadsByTeam);
      }
      return next;
    });
    addLog("Rest of the season simulated.");
  }

  return (
    <div className="min-h-screen flex flex-col">
      <TopBar viewAs={viewAs} setViewAs={setViewAs} poolCount={pool.length} managers={managers} addManager={addManager} phase={phase} />
      {phase === "league" ? (
        <LeagueView
          teams={leagueTeams}
          fixtures={fixtures}
          simulateMatchday={simulateMatchday}
          simulateFullSeason={simulateFullSeason}
          viewAs={viewAs}
          lastSimulatedKeys={lastSimulatedKeys}
        />
      ) : (
      <div className="flex-1 grid grid-cols-1 lg:grid-cols-[280px_1fr_300px] gap-4 p-4 max-w-[1400px] w-full mx-auto">
        <LeftPanel budgets={budgets} squads={squads} managers={managers} removeManager={removeManager} />
        <CenterStage
          current={current}
          timeLeft={timeLeft}
          running={running}
          bidHistory={bidHistory}
          budgets={budgets}
          viewAs={viewAs}
          placeBid={placeBid}
          managers={managers}
        />
        <RightPanel
          viewAs={viewAs}
          pool={pool}
          current={current}
          running={running}
          selectPlayer={selectPlayer}
          startAuction={startAuction}
          pauseAuction={pauseAuction}
          resumeAuction={resumeAuction}
          markSoldNow={markSoldNow}
          skipPlayer={skipPlayer}
          log={log}
          budgets={budgets}
          squads={squads}
          placeBid={placeBid}
          managers={managers}
          defaultBasePrice={defaultBasePrice}

        />
      </div>

// ---------- Auctioneer-controlled bid entry ----------
// The auctioneer calls out whatever bid is actually made on the floor and assigns it to
// a manager — the app no longer just auto-suggests the next +1cr step.
function AuctioneerBidEntry({ current, budgets, squads, placeBid, managers }) {
  const [managerId, setManagerId] = useState(managers[0]?.id ?? "");
  const [amount, setAmount] = useState(current.bid + BID_STEP);

  // Keep the input pre-filled with a sensible next amount, but the auctioneer can change it.
  useEffect(() => {
    setAmount(current.bid + BID_STEP);
  }, [current.bid]);

  // If the selected manager left (or none was selected yet), fall back to the first available.
  useEffect(() => {
    if (!managers.some(m => m.id === managerId)) {
      setManagerId(managers[0]?.id ?? "");
    }
  }, [managers, managerId]);

  const numericAmount = Number(amount);
  const isValid = Number.isFinite(numericAmount) && numericAmount > current.bid && !!managerId;

  function submit() {
    if (!isValid) return;
    placeBid(managerId, numericAmount);
  }

  if (managers.length === 0) {
    return (
      <div className="pt-2 border-t" style={{ borderColor: "var(--panel-line)" }}>
        <p className="text-xs" style={{ color: "var(--muted)" }}>No managers have joined yet — share the page so people can enter their name up top.</p>
      </div>
    );
  }

  return (
    <div className="pt-2 border-t flex flex-col gap-2" style={{ borderColor: "var(--panel-line)" }}>
      <h2 className="text-xs uppercase tracking-wide" style={{ color: "var(--muted)" }}>Call a bid</h2>
      <p className="text-[11px]" style={{ color: "var(--muted)" }}>
        Enter the amount actually called out — it doesn't have to be the suggested step.
      </p>
      <div className="flex gap-2">
        <select
          aria-label="Manager placing the bid"
          value={managerId}
          onChange={e => setManagerId(e.target.value)}
          className="flex-1 rounded px-2 py-1.5 text-sm"
          style={{ background: "var(--pitch-deep)", border: "1px solid var(--panel-line)", color: "var(--chalk)" }}
        >
          {managers.map(m => (
            <option key={m.id} value={m.id}>{managerDisplayName(m)} — {crFmt(budgets[m.id])} left</option>
          ))}
        </select>
        <input
          aria-label="Bid amount in crores"
          type="number"
          min={current.bid + 1}
          step={1}
          value={amount}
          onChange={e => setAmount(e.target.value)}
          className="w-24 rounded px-2 py-1.5 text-sm"
          style={{ background: "var(--pitch-deep)", border: "1px solid var(--panel-line)", color: "var(--chalk)" }}
        />
      </div>
      <button
        onClick={submit}
        disabled={!isValid}
        className="rounded-md py-2 font-semibold disabled:opacity-40 disabled:cursor-not-allowed"
        style={{ background: "var(--gold)", color: "var(--pitch-deep)" }}
      >
        Confirm bid — {crFmt(Number.isFinite(numericAmount) ? numericAmount : current.bid + BID_STEP)} to {managers.find(m => m.id === managerId)?.name ?? "—"}
      </button>
      {!isValid && (
        <p className="text-[11px]" style={{ color: "var(--muted)" }}>Bid must be higher than the current {crFmt(current.bid)}.</p>
      )}
    </div>
  );
}

  function apply() {

// ---------- Per-player override, shown after a player is selected and before the auction goes live ----------
function BasePriceControl({ current, updateBasePrice }) {
  const [amount, setAmount] = useState(current.base);

  // Re-sync the input only when a different player is selected, not on every keystroke.
  useEffect(() => {
    setAmount(current.base);
  }, [current.player.id]);

  const numericAmount = Number(amount);
  const isValid = Number.isFinite(numericAmount) && numericAmount > 0;

  function apply() {
    if (!isValid) return;

  return (
    <div className="pt-2 border-t flex flex-col gap-2" style={{ borderColor: "var(--panel-line)" }}>

          aria-live="polite"
          aria-relevant="additions"
          aria-label="Auction activity log"
        >
          {log.map((l, i) => <p key={i}>{l}</p>)}
        </div>
      </div>
    </div>
  );
}

// ---------- League phase: table + fixtures ----------
function LeagueView({ teams, fixtures, simulateMatchday, simulateFullSeason, viewAs, lastSimulatedKeys }) {
  const standings = computeStandings(teams, fixtures);
  const byId = Object.fromEntries(teams.map(t => [t.id, t]));
  const nextUnplayed = fixtures.findIndex(md => md.some(f => isRealFixture(f) && !f.played));
  const hasUnplayed = nextUnplayed !== -1;
  const isAuctioneer = viewAs === "auctioneer";
  const liveSet = new Set(lastSimulatedKeys || []);

  return (
    <div className="flex-1 grid grid-cols-1 lg:grid-cols-[1fr_1fr] gap-4 p-4 max-w-[1400px] w-full mx-auto">
      <div className="rounded-lg p-4 overflow-x-auto" style={{ background: "var(--panel)", border: "1px solid var(--panel-line)" }}>
        <div className="flex items-baseline justify-between gap-2 mb-3">
          <h2 className="display text-3xl leading-none" style={{ color: "var(--gold)" }}>Premier League</h2>
          <span className="text-xs uppercase tracking-wide" style={{ color: "var(--muted)" }}>Table</span>
        </div>
        <table className="w-full text-sm" style={{ color: "var(--chalk)" }}>
          <thead>
            <tr className="text-left text-xs uppercase tracking-wide" style={{ color: "var(--muted)" }}>
              <th className="py-2 pr-2">Pos</th>
              <th className="py-2 pr-2">Team</th>
              <th className="py-2 pr-1 text-right">P</th>
              <th className="py-2 pr-1 text-right">W</th>
              <th className="py-2 pr-1 text-right">D</th>
              <th className="py-2 pr-1 text-right">L</th>
              <th className="py-2 pr-1 text-right">GF</th>
              <th className="py-2 pr-1 text-right">GA</th>
              <th className="py-2 pr-1 text-right">GD</th>
              <th className="py-2 text-right">Pts</th>
            </tr>
          </thead>
          <tbody>
            {standings.map((row, i) => {
              const t = byId[row.id];
              const isYou = !!t && t.managerId === viewAs;
              return (
                <tr key={row.id} style={{ borderTop: "1px solid var(--panel-line)", background: isYou ? "var(--pitch-deep)" : "transparent" }}>
                  <td className="py-2 pr-2">{i + 1}</td>
                  <td className="py-2 pr-2 font-semibold" style={{ color: t?.color || "var(--chalk)" }}>
                    {row.name}
                    {t?.isCpu && (
                      <span className="ml-1.5 text-[10px] font-normal uppercase tracking-wide px-1 py-0.5 rounded" style={{ background: "var(--panel-line)", color: "var(--muted)" }}>CPU</span>
                    )}
                    {isYou && (
                      <span className="ml-1.5 text-[10px] font-normal uppercase tracking-wide px-1 py-0.5 rounded" style={{ background: "var(--gold)", color: "var(--pitch-deep)" }}>You</span>
                    )}
                  </td>
                  <td className="py-2 pr-1 text-right">{row.Played}</td>
                  <td className="py-2 pr-1 text-right">{row.Won}</td>
                  <td className="py-2 pr-1 text-right">{row.Drawn}</td>
                  <td className="py-2 pr-1 text-right">{row.Lost}</td>
                  <td className="py-2 pr-1 text-right">{row.GoalsFor}</td>
                  <td className="py-2 pr-1 text-right">{row.GoalsAgainst}</td>
                  <td className="py-2 pr-1 text-right">{row.GoalDifference > 0 ? `+${row.GoalDifference}` : row.GoalDifference}</td>
                  <td className="py-2 text-right font-semibold">{row.Points}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
        {isAuctioneer && hasUnplayed && (
          <button
            onClick={simulateFullSeason}
            aria-label="Simulate rest of season"
            className="mt-4 rounded-md py-2 px-3 font-semibold"
            style={{ background: "var(--panel-line)", color: "var(--chalk)" }}
          >
            Simulate rest of season
          </button>
        )}
      </div>

      <div className="rounded-lg p-4 space-y-4" style={{ background: "var(--panel)", border: "1px solid var(--panel-line)" }}>
        <h2 className="text-xs uppercase tracking-wide" style={{ color: "var(--muted)" }}>Fixtures</h2>
        <div className="space-y-4 max-h-[70vh] overflow-y-auto">
          {fixtures.map((matchday, mdIndex) => (
            <div key={mdIndex}>
              <div className="flex items-center justify-between gap-2 mb-2">
                <h3 className="text-sm font-semibold">Matchday {mdIndex + 1}</h3>
                {isAuctioneer && mdIndex === nextUnplayed && (
                  <button
                    onClick={() => simulateMatchday(mdIndex)}
                    aria-label={`Simulate matchday ${mdIndex + 1}`}
                    className="rounded px-3 py-1 text-sm font-semibold"
                    style={{ background: "var(--gold)", color: "var(--pitch-deep)" }}
                  >
                    Simulate this matchday
                  </button>
                )}
              </div>
              <ul className="space-y-1">
                {matchday.filter(isRealFixture).map(f => {
                  const home = clubName(byId[f.home]);
                  const away = clubName(byId[f.away]);
                  const key = fixtureKey(mdIndex, f);
                  const live = liveSet.has(key);
                  return (
                    <li
                      key={key}
                      className="text-sm rounded px-2 py-1.5"
                      style={{ background: "var(--pitch-deep)", border: "1px solid var(--panel-line)" }}
                      {...(live ? { role: "status", "aria-live": "polite" } : {})}
                    >
                      {f.played
                        ? `${home} ${f.homeGoals} – ${f.awayGoals} ${away}`
                        : `${home} vs ${away}`}
                    </li>
                  );
                })}
              </ul>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
